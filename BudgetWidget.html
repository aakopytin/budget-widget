<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  background: #f8f9fd;
  padding: 12px;
}
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}
.title { font-size: 14px; font-weight: 700; color: #111827; }
.sub   { font-size: 10px; color: #9ca3af; margin-left: 8px; }
#status { font-size: 10.5px; color: #d97706; }
#refresh-btn {
  background: none; border: 1px solid #d1d5db; color: #6b7280;
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
#refresh-btn:hover { background: #f3f4f6; }
#content { overflow-x: auto; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <span class="title">&#128202; Бюджет проектов</span>
    <span class="sub">С 01.01.2024 · суммы в тыс. руб.</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="status">&#9679; инициализация...</span>
    <input type="date" id="end-date"
      style="font-size:11px;border:1px solid #d1d5db;border-radius:4px;
             padding:2px 6px;color:#374151;background:#fff;cursor:pointer"
      title="Дата отчёта (факт учитывается до этой даты)">
    <button id="refresh-btn" title="Обновить">&#8635;</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
'use strict';

// ── КОНФИГУРАЦИЯ ─────────────────────────────────────────────────────────────

var START_DATE = '2024-01-01';

// Колонки проектов: pids — множество project_id из Аспро
// Порядок соответствует виджету Бюджет.
// null = catch-all: всё, что не попало в другие колонки и не Админ/Исключения.
// Примечание: pid=17 числится в двух колонках («Прочие РСХБ» и «Проекты без договора»).
// Разделение производится по наименованию транзакции в aggregate() через isBezDogovora().
var PROJ_COLS = [
  { name: 'Сахалин',              pids: { 3: 1 } },          // Южно-Сахалинск
  { name: 'Голутвинский',         pids: { 33: 1 } },
  { name: 'Барнаул',              pids: { 13: 1 } },
  { name: 'Кемерово',             pids: { 1: 1 } },
  { name: 'Киров',                pids: { 12: 1 } },
  { name: 'Сыктывкар',            pids: { 23: 1 } },
  { name: 'Гарпия',               pids: { 22: 1 } },
  { name: 'ЦДА',                  pids: { 2:1, 4:1, 5:1, 6:1, 7:1, 9:1, 10:1, 34:1 } }, // проекты с «ЦДА» в названии
  { name: 'Прочие РСХБ',          pids: { 17: 1 } },          // pid=17 за вычетом «без договора»
  { name: 'Проекты без договора', pids: { 17: 1 } },          // pid=17: «РСХБ лифты» + «РСХБ Петрозаводск» по наименованию
  { name: 'Прочие проекты',       pids: null }                // catch-all
];

// Накладные расходы (Офис / Админ) — проекты 24 и 26
var ADMIN_PIDS = { 24: 1, 26: 1 };

// Проекты, полностью исключённые из виджета (не входят ни в одну колонку):
// 25=Типовой (шаблон), 27=Трансферы, 28=Проект СМ, 35=Внепроектные, 36=Корректировки НДС
var EXCL_PIDS = { 25:1, 27:1, 28:1, 35:1, 36:1 };

// Справочник названий проектов (из st/projects)
var PROJ_NAME_MAP = {
  1:'Кемерово', 2:'Рассказово', 3:'Южно-Сахалинск', 4:'Омутнинск',
  5:'Строитель', 6:'Десногорск', 7:'Иволгинск', 8:'ОКО',
  9:'Рузаевка', 10:'Большое Болдино', 11:'Новокуйбышевск', 12:'Киров',
  13:'Барнаул', 14:'Тамбов', 15:'Одинцово', 16:'Покровское',
  17:'Анадырь', 18:'Уни', 19:'Красногорское', 20:'Чечня',
  21:'Сити', 22:'Москва (Новгородская)', 23:'Сыктывкар',
  24:'ВСИП Общие', 25:'Типовой', 26:'ТТ Общие',
  27:'Трансферы', 28:'Проект СМ', 29:'Первомайское', 30:'Угловское',
  31:'Тогул', 32:'Менжинского', 33:'Голутвинский', 34:'Толбазы',
  35:'Прочие/Закрытые', 36:'Корректировки НДС'
};

// Белый список счетов — идентично Budget1 (VSIP_ACC_IDS + TT_ACC_IDS).
// Исключает технические записи org_id=3 (Бюджетный лимит, account 36),
// которые хранят плановые значения, а не реальное движение денег.
var VSIP_ACC_IDS = {2:1, 3:1, 4:1, 5:1, 6:1, 7:1, 8:1, 161:1, 166:1};
var TT_ACC_IDS   = {18:1};

// Совокупность явно именованных project_id (для определения «Прочих»)
var NAMED_PIDS = {};
PROJ_COLS.forEach(function (c) {
  if (c.pids) Object.keys(c.pids).forEach(function (id) { NAMED_PIDS[+id] = 1; });
});

// Индексы колонок pid=17 — для разделения «Прочие РСХБ» и «Проекты без договора»
var RSKHB_COL = -1, BEZDOG_COL = -1, CDA_COL = -1;
PROJ_COLS.forEach(function (c, i) {
  if (c.name === 'Прочие РСХБ')          RSKHB_COL = i;
  if (c.name === 'Проекты без договора')  BEZDOG_COL = i;
  if (c.name === 'ЦДА')                   CDA_COL   = i;
});

// «Без договора»: pid=17 с наименованием, содержащим «Петрозавод» или «лифт»
var BEZDOG_RE = /петрозавод|лифт/i;
function isBezDogovora(name) {
  return BEZDOG_COL >= 0 && !!name && BEZDOG_RE.test(name);
}

// Категории-переводы и займы — исключаем полностью
var SKIP_CAT_NAMES = {
  'Перевод между счетами (поступление)': 1,
  'Перевод между счетами (списание)': 1,
  'Получение кредита': 1, 'Выплата кредита': 1,
  'Получение займа': 1,  'Выплата займа': 1,
};

// Категории доходов (выручка от основной деятельности)
var INC_CAT_NAMES = {
  'Оказание услуг': 1,
  'Возврат ДС. за заказы': 1,
  'Проценты к получению': 1,
  'Прочий доход': 1,
  'Возврат депозита': 1
};

// category_id-коды НДС — обрабатываются отдельно через PLS
var VAT_CAT_IDS = { 3157: 1, 3158: 1, 3144: 1, 3147: 1 };

// Все реальные банковские счета (без технического счёта 36 = Бюджетный лимит)
var REAL_ACC = {1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,16:1,18:1,26:1,42:1,120:1,161:1,166:1,
                211:1,212:1};  // 211=ВСИП СС, 212=ВСИП ИП — компания «ВСИП Прочие» (org_id=4)

// Admin sub-category ID sets
var ADMIN_FOT_IDS  = {9:1, 10:1, 11:1};   // Зарплата + Налоги с зарплаты
var ADMIN_TRIP_IDS = {7:1};                // Командировки
var ADMIN_BUH_IDS  = {17:1};              // Бухгалтерия
var ADMIN_INT_IDS  = {1008:1};            // Проценты к уплате
var ADMIN_EXCL_IDS = {1009:1};            // Налог на прибыль — исключить из Админ

// Производственные расходы по имени категории
function isProdExpense(catName) {
  if (!catName || SKIP_CAT_NAMES[catName]) return false;
  // Возвраты клиентам (system_code=RETURNS_TO_CUSTOMERS, cat_id=1006) —
  // прямой расход проекта: включается в себестоимость факта так же,
  // как в плане (plan_money type=40 → costP).
  if (catName === 'Возвраты клиентам') return true;
  var l = catName.toLowerCase();
  return (
    l.indexOf('материал') === 0 ||
    l.indexOf('смр') === 0 ||
    (l.indexOf('банков') >= 0 && l.indexOf('гарант') >= 0) ||
    l.indexOf('проектирован') >= 0 ||
    l.indexOf('изыскан') >= 0 ||
    l.indexOf('оборудован') >= 0 ||
    l.indexOf('мобилизац') >= 0 ||
    catName === 'Командировки' ||
    catName === 'Составление исполнительной документации' ||
    catName === 'Услуги по сертификации' ||
    catName === 'Тесты и испытания'
  );
}

// Ставки планового НДС — идентично виджету Бюджет (getPlanExpVatRate / effRates).
// Нет переключения по дате: ставки фиксированные, как в Budget1.
function planExpVatRate(catName) {
  if (!catName) return 0;
  var l = catName.toLowerCase();
  // «...без НДС» в названии → ставка 0 (как в Budget1 getExpCatType)
  if (l.indexOf('без ндс') >= 0) return 0;
  // Нулевая ставка: категории без НДС (ZERO_RATE_CATS из Budget1)
  if (catName === 'Командировки' ||
      catName === 'Составление исполнительной документации' ||
      catName === 'Услуги по сертификации' ||
      catName === 'Тесты и испытания')              return 0;
  if (l.indexOf('проектирован') >= 0 ||
      l.indexOf('изыскан') >= 0)                    return 0;
  if (l.indexOf('банков') >= 0 &&
      l.indexOf('гарант') >= 0)                     return 0;
  // proj_other в Budget1 → DEFAULT_EFF_RATE = 0
  if (l.indexOf('оборудован') >= 0 ||
      l.indexOf('мобилизац') >= 0)                  return 0;
  // СМР: 5/105 (жёстко, как в Budget1 effRates['smr'])
  if (l.indexOf('смр') === 0)                       return 5 / 105;
  // Материалы, Возвраты клиентам, default: 22/122 (как в Budget1 effRates['mat']/'ret')
  return 22 / 122;
}

// Плановая выручка: 22/122 (как в Budget1 шаг 5a)
function planRevVatRate() {
  return 22 / 122;
}

// ── API ───────────────────────────────────────────────────────────────────────

function fetchAll(entity) {
  var all = [], page = 1;
  function next() {
    var url = '/api/data?entity=' + entity + '&limit=100&page=' + page;
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error).slice(0, 80));
        var items = (d.response && d.response.items) || [];
        all = all.concat(items);
        var total = (d.response && d.response.total) || 0;
        setStatus('&#9679; ' + entity + ': ' + all.length + ' / ' + total);
        if (all.length >= total || items.length < 100) return all;
        page++;
        return next();
      });
  }
  return next();
}

// ── АГРЕГАЦИЯ ─────────────────────────────────────────────────────────────────

var NC = PROJ_COLS.length + 1; // Всего + 8 колонок проектов

function newArr() {
  var a = [];
  for (var i = 0; i < NC; i++) a.push(0);
  return a;
}

// Возвращает индекс колонки проекта (0..NC-2) или -1 (Админ/пропуск)
// Колонка Всего — индекс 0 в итоговых массивах (добавляется отдельно)
function colIdx(projId) {
  var pid = projId ? +projId : 0;
  if (pid && ADMIN_PIDS[pid]) return -1;
  for (var i = 0; i < PROJ_COLS.length - 1; i++) {
    if (PROJ_COLS[i].pids && pid && PROJ_COLS[i].pids[pid]) return i;
  }
  // Прочие = последняя колонка проектов
  if (!pid || !NAMED_PIDS[pid]) return PROJ_COLS.length - 1;
  return -1;
}

// Добавляет v в массив: [0]=Всего, [ci+1]=проект
function addV(arr, ci, v) {
  arr[0] += v;
  arr[ci + 1] += v;
}

function aggregate(plans, txns, plsItems, catMap, endDate) {
  // Точка разреза: начало текущего месяца по выбранной дате.
  // Строка «план» (Бюджет) = факт прошлых месяцев + plan_money текущего и будущих.
  // Это повторяет логику колонки «Бюджет» в виджете Бюджет.
  var curMonthStart = endDate.slice(0, 7) + '-01';

  var revP     = newArr(), revF     = newArr();
  var costP    = newArr(), costF    = newArr();
  var vatRevP  = newArr(), vatRevF  = newArr();
  var vatCostP = newArr(), vatCostF = newArr();
  var taxP = 0, taxF = 0;
  var adminFotP=0, adminFotF=0;
  var adminTripP=0, adminTripF=0;
  var adminBuhP=0, adminBuhF=0;
  var adminIntP=0, adminIntF=0;
  var adminOthP=0, adminOthF=0;
  var adminOthNames = {};  // названия категорий, попавших в «Админ · Прочие» (вкл. Бухгалтерию)
  var prochByPid = {};
  function getProchPP(pid) {
    var k = (pid || 0) + '';
    if (!prochByPid[k]) prochByPid[k] = {revP:0,revF:0,costP:0,costF:0,vatRevP:0,vatRevF:0,vatCostP:0,vatCostF:0};
    return prochByPid[k];
  }
  var cdaByPid = {};
  function getCdaPP(pid) {
    var k = (pid || 0) + '';
    if (!cdaByPid[k]) cdaByPid[k] = {revP:0,revF:0,costP:0,costF:0,vatRevP:0,vatRevF:0,vatCostP:0,vatCostF:0};
    return cdaByPid[k];
  }

  // Карта plan_money_id → наименование.
  // Для pid=17 фактические транзакции имеют пустое поле name — реальное название
  // хранится в связанной записи plan_money. Карта нужна для isBezDogovora().
  var pmNameMap = {};
  // Карта plan_money_id → plan_paid_date.
  // PLS-записи НДС создаются в Аспро по дате выставления счёта/акта, которая может
  // не совпадать с датой банковской транзакции. Для корректного isPastP используем
  // дату plan_money, а не дату самой PLS-записи.
  var pmDateMap = {};
  plans.forEach(function(item) {
    if (item.name) pmNameMap[item.id] = item.name;
    if (item.plan_paid_date) pmDateMap[item.id] = item.plan_paid_date;
  });

  // ─── 1. Транзакции (факт + исторический план) ────────────────────────────
  txns.forEach(function (tx) {
    var dt = tx.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    // Все реальные банковские счета (REAL_ACC включает ТТ Депозиты 42, 120)
    var acct = tx.org_account_id;
    if (!REAL_ACC[acct]) return;
    var catName = catMap[tx.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;
    if (VAT_CAT_IDS[tx.category_id]) return;

    var incAmt = parseFloat(tx.income)  || 0;
    var outAmt = parseFloat(tx.outcome) || 0;
    // Корректировки/возвраты со знаком «−»: для расходных категорий netим income из outcome.
    // INC_CAT_NAMES-категории (выручка) не корректируются — там income = сам доход.
    var expAmt = INC_CAT_NAMES[catName] ? outAmt : outAmt - incAmt;
    var isPast = (dt < curMonthStart);  // прошлые месяцы входят в Бюджет

    if (EXCL_PIDS[tx.project_id]) return;  // полностью исключённые проекты

    // Налог на прибыль — отдельная строка, не входит в Админ
    if (tx.category_id === 1009) {
      if (expAmt) { taxF += expAmt; if (isPast) taxP += expAmt; }
      return;
    }

    if (ADMIN_PIDS[tx.project_id]) {
      // Процентные и прочие доходы ВСИП/ТТ → колонка «Прочие проекты» (без НДС)
      if (incAmt > 0 && (catName === 'Проценты к получению' || catName === 'Прочий доход')) {
        var ciAdmR = PROJ_COLS.length - 1;
        addV(revF, ciAdmR, incAmt);
        if (isPast) addV(revP, ciAdmR, incAmt);
        var ppAdmR = getProchPP(tx.project_id);
        ppAdmR.revF += incAmt; if (isPast) ppAdmR.revP += incAmt;
      }
      if (expAmt && !ADMIN_EXCL_IDS[tx.category_id]) {
        var cid4 = tx.category_id;
        if      (ADMIN_FOT_IDS[cid4])  { adminFotF  += expAmt; if (isPast) adminFotP  += expAmt; }
        else if (ADMIN_TRIP_IDS[cid4]) { adminTripF += expAmt; if (isPast) adminTripP += expAmt; }
        else if (ADMIN_BUH_IDS[cid4])  { adminBuhF  += expAmt; if (isPast) adminBuhP  += expAmt; if (catName) adminOthNames[catName] = 1; }
        else if (ADMIN_INT_IDS[cid4])  { adminIntF  += expAmt; if (isPast) adminIntP  += expAmt; }
        else                           { adminOthF  += expAmt; if (isPast) adminOthP  += expAmt; if (catName) adminOthNames[catName] = 1; }
      }
      return;
    }

    var ci = colIdx(tx.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию plan_money (tx.name всегда пусто для pid=17)
    if (ci === RSKHB_COL) {
      var pmNameTx = pmNameMap[tx.plan_money_id] || tx.name || tx.description || tx.comment || '';
      if (isBezDogovora(pmNameTx)) ci = BEZDOG_COL;
    }
    // Прочие проекты: расходные транзакции с «Лифты»/«Петрозаводск»
    // в описании или наименовании plan_money → «Проекты без договора»
    if (ci === PROJ_COLS.length - 1) {
      var prochNameTx = tx.description || tx.name || tx.comment || pmNameMap[tx.plan_money_id] || '';
      if (isBezDogovora(prochNameTx)) ci = BEZDOG_COL;
    }

    // Все не-доходные категории = расход по проекту (аналогично plan_money, где ВСЕ type=40
    // попадают в costP без фильтра по isProdExpense).
    var isProch  = (ci === PROJ_COLS.length - 1);
    var isExp    = !INC_CAT_NAMES[catName];

    // Факт (все транзакции ≤ endDate)
    if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revF, ci, incAmt);
    if (expAmt && isExp)                       addV(costF, ci, expAmt);

    // Историческая часть плана (прошлые месяцы: факт = план)
    if (isPast) {
      if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revP, ci, incAmt);
      if (expAmt && isExp)                       addV(costP, ci, expAmt);
    }
    // Детализация «Прочих» по project_id
    if (isProch) {
      var ppTx = getProchPP(tx.project_id);
      if (incAmt > 0 && INC_CAT_NAMES[catName]) { ppTx.revF += incAmt; if (isPast) ppTx.revP += incAmt; }
      if (expAmt && isExp)                       { ppTx.costF += expAmt; if (isPast) ppTx.costP += expAmt; }
    }
    // Детализация «ЦДА» по project_id
    if (ci === CDA_COL) {
      var ppCda = getCdaPP(tx.project_id);
      if (incAmt > 0 && INC_CAT_NAMES[catName]) { ppCda.revF += incAmt; if (isPast) ppCda.revP += incAmt; }
      if (expAmt && isExp)                       { ppCda.costF += expAmt; if (isPast) ppCda.costP += expAmt; }
    }
  });

  // ─── 2. PLS: выделенный НДС факт (идентично Budget1 calcVatForecast шаги 4a/4b) ──
  // cat=3147 (Налог-НДС, income)   → vatRevF/vatRevP  (НДС начисленный на доходы)
  // cat=3144 (Налоги-НДС, outcome) → vatCostF/vatCostP (НДС к вычету по расходам)
  // Одинаковая логика для 2025 и 2026 — «по выделенному из транзакций НДС».
  plsItems.forEach(function (p) {
    var dt = p.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    var acctP = p.org_account_id;
    if (acctP && !REAL_ACC[acctP]) return;
    if (EXCL_PIDS[p.project_id]) return;
    var ci = colIdx(p.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию plan_money
    if (ci === RSKHB_COL) {
      var pmNamePls = pmNameMap[p.plan_money_id] || p.name || p.description || '';
      if (isBezDogovora(pmNamePls)) ci = BEZDOG_COL;
    }
    // Прочие проекты: PLS с «Лифты»/«Петрозаводск» → «Проекты без договора»
    if (ci === PROJ_COLS.length - 1) {
      var prochNamePls = p.description || p.name || pmNameMap[p.plan_money_id] || '';
      if (isBezDogovora(prochNamePls)) ci = BEZDOG_COL;
    }
    // isPastP: используем дату plan_money (когда признан доход/расход), а не дату PLS.
    // PLS-записи в Аспро могут быть созданы позже (например, при выставлении акта),
    // тогда как сам доход уже проведён в прошлом периоде. Без этой коррекции
    // vatRevF включает «старые» PLS с текущей датой, vatRevP — нет → Plan ≠ Fact без НДС.
    var plsRefDate = (p.plan_money_id && pmDateMap[p.plan_money_id]) || dt;
    var isPastP = (plsRefDate < curMonthStart);

    if (p.category_id === 3147) {                    // НДС начисленный (доходы)
      var vIn = (parseFloat(p.income) || 0) - (parseFloat(p.outcome) || 0);
      addV(vatRevF, ci, vIn);
      if (isPastP) addV(vatRevP, ci, vIn);
      if (ci === PROJ_COLS.length - 1) { var ppPls = getProchPP(p.project_id); ppPls.vatRevF += vIn; if (isPastP) ppPls.vatRevP += vIn; }
      if (ci === CDA_COL)              { var ppCdaV = getCdaPP(p.project_id);  ppCdaV.vatRevF += vIn; if (isPastP) ppCdaV.vatRevP += vIn; }
    } else if (p.category_id === 3144) {             // НДС к вычету (расходы)
      var vOut = (parseFloat(p.outcome) || 0) - (parseFloat(p.income) || 0);
      addV(vatCostF, ci, vOut);
      if (isPastP) addV(vatCostP, ci, vOut);
      if (ci === PROJ_COLS.length - 1) { var ppPls = getProchPP(p.project_id); ppPls.vatCostF += vOut; if (isPastP) ppPls.vatCostP += vOut; }
      if (ci === CDA_COL)              { var ppCdaV = getCdaPP(p.project_id);  ppCdaV.vatCostF += vOut; if (isPastP) ppCdaV.vatCostP += vOut; }
    }
  });

  // ─── 3. Plan_money: только текущий месяц и будущие (org_account_id=36 «Бюджетный лимит» или 150 «Внебюджетный лимит») ───
  plans.forEach(function (item) {
    if (item.org_account_id !== 36 && item.org_account_id !== 150) return;
    var dt = item.plan_paid_date || '';
    if (!dt || dt < curMonthStart) return;          // только тек. месяц+будущее
    var val     = parseFloat(item.total) || 0;
    var catName = catMap[item.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;

    if (EXCL_PIDS[item.project_id]) return;  // полностью исключённые проекты

    // Налог на прибыль — план
    if (item.category_id === 1009) {
      if (item.type === 40) taxP += val;
      return;
    }

    if (ADMIN_PIDS[item.project_id]) {
      // Процентные и прочие доходы ВСИП/ТТ (plan_money type=30) → Прочие проекты (без НДС)
      if (item.type === 30 && (catName === 'Проценты к получению' || catName === 'Прочий доход')) {
        var ciAdmR2 = PROJ_COLS.length - 1;
        addV(revP, ciAdmR2, val);
        var ppAdmR2 = getProchPP(item.project_id);
        ppAdmR2.revP += val;
      }
      if (item.type === 40 && !ADMIN_EXCL_IDS[item.category_id]) {
        var cid5 = item.category_id;
        if (VAT_CAT_IDS[cid5]) return;  // НДС учитывается отдельно в НДС-разделе
        if      (ADMIN_FOT_IDS[cid5])  adminFotP  += val;
        else if (ADMIN_TRIP_IDS[cid5]) adminTripP += val;
        else if (ADMIN_BUH_IDS[cid5])  { adminBuhP  += val; if (catName) adminOthNames[catName] = 1; }
        else if (ADMIN_INT_IDS[cid5])  adminIntP  += val;
        else                           { adminOthP  += val; if (catName) adminOthNames[catName] = 1; }
      }
      return;
    }

    var ci = colIdx(item.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию плановой заявки
    if (ci === RSKHB_COL && isBezDogovora(item.name || item.description || '')) ci = BEZDOG_COL;

    if (item.type === 30) {                         // доходы
      var rvr = planRevVatRate();
      addV(revP, ci, val);
      addV(vatRevP, ci, Math.round(val * rvr));
      if (ci === PROJ_COLS.length - 1) { var ppPM = getProchPP(item.project_id); ppPM.revP += val; ppPM.vatRevP += Math.round(val * rvr); }
      if (ci === CDA_COL)              { var ppCdaPM = getCdaPP(item.project_id); ppCdaPM.revP += val; ppCdaPM.vatRevP += Math.round(val * rvr); }
    } else if (item.type === 40) {                  // расходы
      // Budget1 включает ВСЕ plan_money type=40 в be_plan без фильтра по категории.
      // isProdExpense применяется только к фактическим транзакциям, не к plan_money.
      addV(costP, ci, val);
      // НДС на plan_money: производственные категории + «Возвраты клиентам» в Прочих
      var isProchPM = (ci === PROJ_COLS.length - 1);
      var isCdaPM   = (ci === CDA_COL);
      if (isProdExpense(catName) || (isProchPM && catName === 'Возвраты клиентам')) {
        addV(vatCostP, ci, Math.round(val * planExpVatRate(catName)));
      }
      if (isProchPM) {
        var ppPM = getProchPP(item.project_id);
        ppPM.costP += val;
        if (isProdExpense(catName) || catName === 'Возвраты клиентам') ppPM.vatCostP += Math.round(val * planExpVatRate(catName));
      }
      if (isCdaPM) {
        var ppCdaPM = getCdaPP(item.project_id);
        ppCdaPM.costP += val;
        if (isProdExpense(catName)) ppCdaPM.vatCostP += Math.round(val * planExpVatRate(catName));
      }
    }
  });

  return {
    revP: revP, revF: revF,
    costP: costP, costF: costF,
    vatRevP: vatRevP,   vatRevF: vatRevF,
    vatCostP: vatCostP, vatCostF: vatCostF,
    adminFotP: adminFotP,   adminFotF: adminFotF,
    adminTripP: adminTripP, adminTripF: adminTripF,
    adminBuhP: adminBuhP,   adminBuhF: adminBuhF,
    adminIntP: adminIntP,   adminIntF: adminIntF,
    adminOthP: adminOthP,   adminOthF: adminOthF,
    taxP: taxP, taxF: taxF,
    adminP: adminFotP+adminTripP+adminBuhP+adminIntP+adminOthP,
    adminF: adminFotF+adminTripF+adminBuhF+adminIntF+adminOthF,
    prochByPid: prochByPid,
    cdaByPid: cdaByPid,
    adminOthNames: Object.keys(adminOthNames).sort(function(a, b) { return a.localeCompare(b, 'ru'); })
  };
}

    var pp = cdaByPid[pid] || {};

  });

  var nExtra = pids.length;

            'font-size:10px;font-weight:600;white-space:nowrap;text-align:right;color:#374151;';

  var TD  = 'padding:2px 8px;font-size:11px;text-align:right;white-space:nowrap;';

       'padding:6px 2px;user-select:none;list-style:none">' +
       '&#9660;&nbsp;Расшифровка «ЦДА» по проектам &mdash; Выручка / Себестоимость / Наценка</summary>';
  h += '<div style="overflow-x:auto;margin-top:6px">';

  h += '<thead><tr>';
  h += '<th style="' + CS2 + 'text-align:left;min-width:180px">Показатель</th>';
  h += '<th style="' + CS2 + ';min-width:50px;color:#6b7280">Строка</th>';
  h += '<th style="' + CS2 + ';min-width:80px">Итого</th>';
  pids.forEach(function(pid) {

  function emitSect(label, italic, color, bg, bgF, bgO, getP, getF) {

      var pp = cdaByPid[pid] || {};

    h += '<td rowspan="3" style="' + lblStyle + 'background:' + bg + ';border-bottom:2px solid #e5e7eb;">' + label + '</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';color:#6b7280">план</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';font-weight:600">' + fmtK(totalP, true) + '</td>';
    pids.forEach(function(pid) { var pp = cdaByPid[pid]||{}; h += '<td style="' + TD + BD2 + 'background:' + bg  + '">' + fmtK(getP(pp)) + '</td>'; });
    h += '</tr><tr>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';color:#6b7280">факт</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';font-weight:600">' + fmtK(totalF, true) + '</td>';
    pids.forEach(function(pid) { var pp = cdaByPid[pid]||{}; h += '<td style="' + TD + BD2 + 'background:' + bgF + '">' + fmtK(getF(pp)) + '</td>'; });
    h += '</tr><tr>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';color:#6b7280">остаток</td>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';font-weight:600">' + fmtOst(totalO, true) + '</td>';
    pids.forEach(function(pid) { var pp = cdaByPid[pid]||{}; h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + '">' + fmtOst(getP(pp) - getF(pp)) + '</td>'; });
    h += '</tr>';

  }

  var BW = '#ffffff', BF2 = '#fafbff', BO2 = '#f8fdf9';

  return h;

// ── РАСШИФРОВКА ПРОЧИХ ────────────────────────────────────────────────────────

    return pp.revP || pp.revF || pp.costP || pp.costF;
  }).sort(function(a, b) { return a - b; });
  if (!pids.length) return '';

  var nExtra = pids.length;
  var CS2 = 'padding:4px 8px;background:#f0f4f9;border-bottom:2px solid #3d5c7a;' +
            'font-size:10px;font-weight:600;white-space:nowrap;text-align:right;color:#374151;';
  var BD2 = 'border-bottom:1px solid #f0f0f0;';
  var TD  = 'padding:2px 8px;font-size:11px;text-align:right;white-space:nowrap;';

  var h = '<details style="margin-top:18px">';
  h += '<summary style="cursor:pointer;font-weight:600;font-size:11px;color:#3d5c7a;' +
       'padding:6px 2px;user-select:none;list-style:none">' +
       '&#9660;&nbsp;Расшифровка «Прочие проекты» по проектам &mdash; Выручка / Себестоимость / Наценка</summary>';
  h += '<div style="overflow-x:auto;margin-top:6px">';
  h += '<table style="border-collapse:collapse;font-size:11px;width:100%">';

  // Header
  h += '<thead><tr>';
  h += '<th style="' + CS2 + 'text-align:left;min-width:180px">Показатель</th>';
  h += '<th style="' + CS2 + ';min-width:50px;color:#6b7280">Строка</th>';
  h += '<th style="' + CS2 + ';min-width:80px">Итого</th>';
  pids.forEach(function(pid) {
    var pname = PROJ_NAME_MAP[pid] || ('Пр. ' + pid);
    h += '<th style="' + CS2 + ';min-width:80px">' + pname + '</th>';
  });
  h += '</tr></thead><tbody>';

  // ── Helper: emit 3 sub-rows (план / факт / остаток) for one section ────────
  function emitSect(label, italic, color, bg, bgF, bgO, getP, getF) {
    var totalP = 0, totalF = 0;
    pids.forEach(function(pid) { totalP += getP(prochByPid[pid]); totalF += getF(prochByPid[pid]); });
    var totalO = totalP - totalF;

    var lblStyle = 'padding:2px 8px;font-size:11px;white-space:nowrap;' +
                   (italic ? 'font-style:italic;' : '') +
                   (color  ? 'color:' + color + ';' : '') + 'font-weight:600;';

    // план
    h += '<tr>';
    h += '<td rowspan="3" style="' + lblStyle + 'background:' + bg  + ';border-bottom:2px solid #e5e7eb;">' + label + '</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';color:#6b7280">план</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';font-weight:600">' + fmtK(totalP, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + BD2 + 'background:' + bg  + '">' + fmtK(getP(prochByPid[pid])) + '</td>'; });
    h += '</tr>';
    // факт
    h += '<tr>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';color:#6b7280">факт</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';font-weight:600">' + fmtK(totalF, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + BD2 + 'background:' + bgF + '">' + fmtK(getF(prochByPid[pid])) + '</td>'; });

    // остаток
    h += '<tr>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';color:#6b7280">остаток</td>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';font-weight:600">' + fmtOst(totalO, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + '">' + fmtOst(getP(prochByPid[pid]) - getF(prochByPid[pid])) + '</td>'; });

  function gap2() {
