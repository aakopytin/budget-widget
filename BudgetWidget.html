<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  background: #f8f9fd;
  padding: 12px;
}
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}
.title { font-size: 14px; font-weight: 700; color: #111827; }
.sub   { font-size: 10px; color: #9ca3af; margin-left: 8px; }
#status { font-size: 10.5px; color: #d97706; }
#refresh-btn {
  background: none; border: 1px solid #d1d5db; color: #6b7280;
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
#refresh-btn:hover { background: #f3f4f6; }
#content { overflow-x: auto; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <span class="title">&#128202; Бюджет проектов</span>
    <span class="sub">С 01.01.2025 · суммы в тыс. руб.</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="status">&#9679; инициализация...</span>
    <input type="date" id="end-date"
      style="font-size:11px;border:1px solid #d1d5db;border-radius:4px;
             padding:2px 6px;color:#374151;background:#fff;cursor:pointer"
      title="Дата отчёта (факт учитывается до этой даты)">
    <button id="refresh-btn" title="Обновить">&#8635;</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
'use strict';

// ── КОНФИГУРАЦИЯ ─────────────────────────────────────────────────────────────

var START_DATE = '2025-01-01';

// Колонки проектов: pids — множество project_id из Аспро
// Порядок соответствует виджету Бюджет.
// null = «Прочие» (catch-all: всё, что не попало в другие колонки и не Админ)
var PROJ_COLS = [
  { name: 'Кемерово',     pids: { 1: 1 } },
  { name: 'Десногорск',   pids: { 6: 1 } },
  { name: 'Киров',        pids: { 12: 1 } },
  { name: 'Сыктывкар',   pids: { 23: 1 } },
  { name: 'Барнаул',      pids: { 13: 1 } },
  { name: 'Рузаевка',     pids: { 9: 1 } },
  { name: 'Сахалин',      pids: { 3: 1, 25: 1 } },   // Южно-Сахалинск
  { name: 'Голутвинский', pids: { 33: 1 } },
  { name: 'ЦДА',          pids: { 18:1, 19:1, 29:1, 30:1, 31:1, 32:1 } }, // Центральный договор
  { name: 'Прочие',       pids: null }                // catch-all
];

// Накладные расходы (Офис / Админ) — проекты 24 и 26
var ADMIN_PIDS = { 24: 1, 26: 1 };

// Проекты, полностью исключённые из виджета — отсутствуют в PID_MAP виджета Бюджет,
// поэтому не должны влиять ни на одну строку Budget2.
var EXCL_PIDS = { 5:1, 8:1, 11:1, 14:1, 15:1, 16:1, 27:1, 28:1, 34:1, 36:1 };

// Белый список счетов — идентично Budget1 (VSIP_ACC_IDS + TT_ACC_IDS).
// Исключает технические записи org_id=3 (Бюджетный лимит, account 36),
// которые хранят плановые значения, а не реальное движение денег.
var VSIP_ACC_IDS = {2:1, 3:1, 4:1, 5:1, 6:1, 7:1, 8:1, 161:1, 166:1};
var TT_ACC_IDS   = {18:1};

// Совокупность явно именованных project_id (для определения «Прочих»)
var NAMED_PIDS = {};
PROJ_COLS.forEach(function (c) {
  if (c.pids) Object.keys(c.pids).forEach(function (id) { NAMED_PIDS[+id] = 1; });
});

// Категории-переводы и займы — исключаем полностью
var SKIP_CAT_NAMES = {
  'Перевод между счетами (поступление)': 1,
  'Перевод между счетами (списание)': 1,
  'Получение кредита': 1, 'Выплата кредита': 1,
  'Получение займа': 1,  'Выплата займа': 1,
  'Проценты к уплате': 1
};

// Категории доходов (выручка от основной деятельности)
var INC_CAT_NAMES = {
  'Оказание услуг': 1,
  'Возврат ДС. за заказы': 1,
  'Проценты к получению': 1,
  'Прочий доход': 1,
  'Возврат депозита': 1
};

// category_id-коды НДС — обрабатываются отдельно через PLS
var VAT_CAT_IDS = { 3157: 1, 3158: 1, 3144: 1, 3147: 1 };

// Производственные расходы по имени категории
function isProdExpense(catName) {
  if (!catName || SKIP_CAT_NAMES[catName]) return false;
  var l = catName.toLowerCase();
  return (
    l.indexOf('материал') === 0 ||
    l.indexOf('смр') === 0 ||
    (l.indexOf('банков') >= 0 && l.indexOf('гарант') >= 0) ||
    l.indexOf('проектирован') >= 0 ||
    l.indexOf('изыскан') >= 0 ||
    l.indexOf('оборудован') >= 0 ||
    l.indexOf('мобилизац') >= 0 ||
    catName === 'Командировки' ||
    catName === 'Составление исполнительной документации' ||
    catName === 'Услуги по сертификации' ||
    catName === 'Тесты и испытания'
  );
}

// Ставка НДС на плановый расход по имени категории (выделенный НДС / сумма с НДС)
function planExpVatRate(catName) {
  if (!catName) return 0;
  var l = catName.toLowerCase();
  if (l.indexOf('смр') === 0)          return 5 / 105;   // 5%
  if (l.indexOf('материал') === 0)     return 20 / 120;  // 20%
  if (l.indexOf('проектирован') >= 0 ||
      l.indexOf('изыскан') >= 0)       return 0;         // 0%
  if (l.indexOf('банков') >= 0 &&
      l.indexOf('гарант') >= 0)        return 0;         // 0%
  return 20 / 120;                                        // по умолчанию 20%
}

// ── API ───────────────────────────────────────────────────────────────────────

function fetchAll(entity) {
  var all = [], page = 1;
  function next() {
    var url = '/api/data?entity=' + entity + '&limit=100&page=' + page;
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error).slice(0, 80));
        var items = (d.response && d.response.items) || [];
        all = all.concat(items);
        var total = (d.response && d.response.total) || 0;
        setStatus('&#9679; ' + entity + ': ' + all.length + ' / ' + total);
        if (all.length >= total || items.length < 100) return all;
        page++;
        return next();
      });
  }
  return next();
}

// ── АГРЕГАЦИЯ ─────────────────────────────────────────────────────────────────

var NC = PROJ_COLS.length + 1; // Всего + 8 колонок проектов

function newArr() {
  var a = [];
  for (var i = 0; i < NC; i++) a.push(0);
  return a;
}

// Возвращает индекс колонки проекта (0..NC-2) или -1 (Админ/пропуск)
// Колонка Всего — индекс 0 в итоговых массивах (добавляется отдельно)
function colIdx(projId) {
  var pid = projId ? +projId : 0;
  if (pid && ADMIN_PIDS[pid]) return -1;
  for (var i = 0; i < PROJ_COLS.length - 1; i++) {
    if (PROJ_COLS[i].pids && pid && PROJ_COLS[i].pids[pid]) return i;
  }
  // Прочие = последняя колонка проектов
  if (!pid || !NAMED_PIDS[pid]) return PROJ_COLS.length - 1;
  return -1;
}

// Добавляет v в массив: [0]=Всего, [ci+1]=проект
function addV(arr, ci, v) {
  arr[0] += v;
  arr[ci + 1] += v;
}

function aggregate(plans, txns, plsItems, catMap, endDate) {
  // Точка разреза: начало текущего месяца по выбранной дате.
  // Строка «план» (Бюджет) = факт прошлых месяцев + plan_money текущего и будущих.
  // Это повторяет логику колонки «Бюджет» в виджете Бюджет.
  var curMonthStart = endDate.slice(0, 7) + '-01';

  var revP     = newArr(), revF     = newArr();
  var costP    = newArr(), costF    = newArr();
  var vatRevP  = newArr(), vatRevF  = newArr();
  var vatCostP = newArr(), vatCostF = newArr();
  var adminP = 0, adminF = 0;

  // ─── 1. Транзакции (факт + исторический план) ────────────────────────────
  txns.forEach(function (tx) {
    var dt = tx.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    // Только реальные банковские счета ВСИП и ТТ (идентично Budget1)
    var acct = tx.org_account_id;
    if (!VSIP_ACC_IDS[acct] && !TT_ACC_IDS[acct]) return;
    var catName = catMap[tx.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;
    if (VAT_CAT_IDS[tx.category_id]) return;

    var incAmt = parseFloat(tx.income)  || 0;
    var expAmt = parseFloat(tx.outcome) || 0;
    var isPast = (dt < curMonthStart);  // прошлые месяцы входят в Бюджет

    if (EXCL_PIDS[tx.project_id]) return;  // полностью исключённые проекты

    if (ADMIN_PIDS[tx.project_id]) {
      if (expAmt) {
        adminF += expAmt;
        if (isPast) adminP += expAmt;  // ист. факт → часть плана
      }
      return;
    }

    var ci = colIdx(tx.project_id);
    if (ci < 0) return;

    // «Возвраты клиентам» учитываются в себестоимости Прочих — идентично Budget1,
    // где isExpense возвращает true для этой категории при proj === 'Прочие'/'Прочие/Закрытые'.
    var isProch  = (ci === PROJ_COLS.length - 1);
    var isRetCli = (catName === 'Возвраты клиентам');
    var isExp    = isProdExpense(catName) || (isProch && isRetCli);

    // Факт (все транзакции ≤ endDate)
    if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revF,  ci, incAmt);
    if (expAmt && isExp)                       addV(costF, ci, expAmt);

    // Историческая часть плана (прошлые месяцы: факт = план)
    if (isPast) {
      if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revP,  ci, incAmt);
      if (expAmt && isExp)                       addV(costP, ci, expAmt);
    }
  });

  // ─── 2. PLS: НДС факт + историческая часть плана НДС ────────────────────
  plsItems.forEach(function (p) {
    var dt = p.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    // Фильтр по счёту — если поле присутствует в PLS-записи
    var acctP = p.org_account_id;
    if (acctP && !VSIP_ACC_IDS[acctP] && !TT_ACC_IDS[acctP]) return;
    if (EXCL_PIDS[p.project_id]) return;
    var ci     = colIdx(p.project_id);
    var isPast = (dt < curMonthStart);

    if (p.category_id === 3158) {                   // НДС исходящий (на доходы)
      var vIn = parseFloat(p.income) || 0;
      if (ci >= 0) {
        addV(vatRevF, ci, vIn);
        if (isPast) addV(vatRevP, ci, vIn);
      }
    } else if (p.category_id === 3157) {            // НДС входящий (к вычету)
      var vOut = parseFloat(p.outcome) || 0;
      if (ci >= 0) {
        addV(vatCostF, ci, vOut);
        if (isPast) addV(vatCostP, ci, vOut);
      }
    }
  });

  // ─── 3. Plan_money: только текущий месяц и будущие (org_account_id=36) ───
  plans.forEach(function (item) {
    if (item.org_account_id !== 36) return;
    var dt = item.plan_paid_date || '';
    if (!dt || dt < curMonthStart) return;          // только тек. месяц+будущее
    var val     = parseFloat(item.total) || 0;
    var catName = catMap[item.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;

    if (EXCL_PIDS[item.project_id]) return;  // полностью исключённые проекты

    if (ADMIN_PIDS[item.project_id]) {
      if (item.type === 40) adminP += val;
      return;
    }

    var ci = colIdx(item.project_id);
    if (ci < 0) return;

    if (item.type === 30) {                         // доходы
      addV(revP, ci, val);
      addV(vatRevP, ci, Math.round(val * 20 / 120));
    } else if (item.type === 40) {                  // расходы
      // Budget1 включает ВСЕ plan_money type=40 в be_plan без фильтра по категории.
      // isProdExpense применяется только к фактическим транзакциям, не к plan_money.
      addV(costP, ci, val);
      if (isProdExpense(catName)) {
        addV(vatCostP, ci, Math.round(val * planExpVatRate(catName)));
      }
    }
  });

  return {
    revP: revP, revF: revF,
    costP: costP, costF: costF,
    vatRevP: vatRevP,   vatRevF: vatRevF,
    vatCostP: vatCostP, vatCostF: vatCostF,
    adminP: adminP, adminF: adminF
  };
}

// ── ФОРМАТИРОВАНИЕ ────────────────────────────────────────────────────────────

function fmtK(v, bold) {
  if (v === null || v === undefined) return '<span style="color:#ccc">—</span>';
  if (v === 0) return '<span style="color:#9ca3af">0</span>';
  var abs  = Math.abs(v) / 1000;
  var s    = abs.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  var neg  = v < 0;
  var txt  = neg ? '(' + s + ')' : s;
  if (neg)  return bold ? '<strong style="color:#dc2626">' + txt + '</strong>'
                        : '<span style="color:#dc2626">' + txt + '</span>';
  return bold ? '<strong>' + txt + '</strong>' : txt;
}

function fmtOst(v, bold) {
  if (v === null || v === undefined) return '<span style="color:#ccc">—</span>';
  if (v === 0) return '<span style="color:#9ca3af">0</span>';
  var abs  = Math.abs(v) / 1000;
  var s    = abs.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  var neg  = v < 0;
  var txt  = neg ? '(' + s + ')' : s;
  var clr  = neg ? '#dc2626' : '#059669';
  return bold ? '<strong style="color:' + clr + '">' + txt + '</strong>'
              : '<span style="color:' + clr + '">' + txt + '</span>';
}

// ── ТАБЛИЦА ───────────────────────────────────────────────────────────────────

function buildTable(agg) {

  // Вспомогательные операции над массивами длиной NC
  function vsub(a, b) { return a.map(function (v, i) { return v - b[i]; }); }
  function ext1(val)  {
    // Только Всего (индекс 0), остальные = 0
    var a = [val];
    for (var i = 1; i < NC; i++) a.push(0);
    return a;
  }

  // ─── Вычисляемые строки ───────────────────────────────────────────────────
  var revNetP   = vsub(agg.revP,  agg.vatRevP);
  var revNetF   = vsub(agg.revF,  agg.vatRevF);
  var costNetP  = vsub(agg.costP, agg.vatCostP);
  var costNetF  = vsub(agg.costF, agg.vatCostF);

  var markGrossP = vsub(agg.revP,   agg.costP);
  var markGrossF = vsub(agg.revF,   agg.costF);
  var markNetP   = vsub(revNetP,    costNetP);
  var markNetF   = vsub(revNetF,    costNetF);

  // «Наценка за вычетом НДС» = Наценка без НДС
  // (остаток на 01.01.2024 будет добавлен после уточнения)
  var adjMarkP   = markNetP.slice();
  var adjMarkF   = markNetF.slice();

  // Админ: только в колонке «Всего»
  var adminProw  = ext1(agg.adminP);
  var adminFrow  = ext1(agg.adminF);

  // Прибыль = Наценка за вычетом НДС − Админ
  var profitP    = vsub(adjMarkP, adminProw);
  var profitF    = vsub(adjMarkF, adminFrow);

  // Налог на прибыль — пока не заполнен
  var taxP       = newArr();
  var taxF       = newArr();

  // Чистая прибыль = Прибыль − Налог
  var netProfP   = vsub(profitP, taxP);
  var netProfF   = vsub(profitF, taxF);

  // ─── HTML-хелперы ─────────────────────────────────────────────────────────
  var CS = 'padding:5px 8px;border-bottom:2px solid #3d5c7a;font-size:10px;' +
           'font-weight:600;white-space:nowrap;background:#f0f4f9;color:#374151;';
  var BD = 'border-bottom:1px solid #f0f0f0;';
  var BG_W   = '#ffffff';
  var BG_F   = '#fafbff';
  var BG_OST = '#f8fdf9';
  var BG_GAP = '#f8f9fd';

  function th(v, align) {
    return '<th style="' + CS + 'text-align:' + (align || 'right') + '">' + v + '</th>';
  }
  function tdV(v, bg, extra) {
    return '<td style="padding:2px 8px;text-align:right;white-space:nowrap;' +
           BD + 'background:' + bg + ';' + (extra || '') + '">' + v + '</td>';
  }
  function tdL(v, bg, extra) {
    return '<td style="padding:2px 8px;white-space:nowrap;' +
           BD + 'background:' + bg + ';' + (extra || '') + '">' + v + '</td>';
  }

  // Одна секция (три строки: план / факт / остаток)
  function section(label, pVals, fVals, opts) {
    opts = opts || {};
    var bg1 = opts.bg  || BG_W;
    var bg2 = opts.bg2 || BG_F;
    var bg3 = opts.bg3 || BG_OST;
    var bot3 = 'border-bottom:2px solid #e5e7eb;';

    var labelStyle = 'font-size:10px;font-weight:600;color:' +
                     (opts.color || '#374151') +
                     (opts.italic ? ';font-style:italic' : '');

    var oVals = vsub(pVals, fVals);
    var html  = '';

    // Строка «план»
    html += '<tr>';
    html += tdL('<span style="' + labelStyle + '">' + label + '</span>', bg1,
                'border-top:' + (opts.borderTop || '1px solid #f0f0f0'));
    html += tdL('<span style="font-size:10px;color:#6b7280">план (бюджет)</span>', bg1);
    pVals.forEach(function (v, i) {
      html += tdV(fmtK(v, i === 0), bg1, i === 0 ? 'font-weight:600' : '');
    });
    html += '</tr>';

    // Строка «факт»
    html += '<tr>';
    html += tdL('', bg2);
    html += tdL('<span style="font-size:10px;color:#6b7280">факт</span>', bg2);
    fVals.forEach(function (v, i) {
      html += tdV(fmtK(v, i === 0), bg2, i === 0 ? 'font-weight:600' : '');
    });
    html += '</tr>';

    // Строка «остаток»
    html += '<tr>';
    html += tdL('', bg3, bot3);
    html += tdL('<span style="font-size:10px;color:#6b7280">остаток</span>', bg3, bot3);
    oVals.forEach(function (v, i) {
      html += tdV(fmtOst(v, i === 0), bg3,
                  bot3 + (i === 0 ? 'font-weight:600' : ''));
    });
    html += '</tr>';

    return html;
  }

  function gap() {
    return '<tr><td colspan="' + (NC + 2) + '" style="height:7px;background:' +
           BG_GAP + ';border:none"></td></tr>';
  }

  // ─── Шапка таблицы ───────────────────────────────────────────────────────
  var html = '<table style="width:100%;border-collapse:collapse;font-size:10.5px">';
  html += '<thead><tr>';
  html += th('Показатель', 'left');
  html += th('&nbsp;',     'left');
  html += th('Всего');
  PROJ_COLS.forEach(function (c) { html += th(c.name); });
  html += '</tr></thead><tbody>';

  // ─── Строки ──────────────────────────────────────────────────────────────
  html += section('Выручка с НДС',        agg.revP,  agg.revF);
  html += section('Себестоимость с НДС',  agg.costP, agg.costF);
  html += section('Наценка с НДС',        markGrossP, markGrossF,
                  { italic: true, color: '#1e40af' });

  html += gap();

  html += section('Выручка без НДС',       revNetP,  revNetF);
  html += section('Себестоимость без НДС', costNetP, costNetF);
  html += section('Наценка без НДС',       markNetP, markNetF,
                  { italic: true, color: '#1e40af' });

  html += section('Наценка за вычетом НДС¹', adjMarkP, adjMarkF,
                  { italic: true, color: '#92400e',
                    bg: '#fffbeb', bg2: '#fef9e7', bg3: '#fef3c7',
                    borderTop: '2px solid #fde68a' });

  html += gap();

  html += section('Админ²',           adminProw, adminFrow,
                  { bg: '#fff7ed', bg2: '#fef5ec', bg3: '#fde8c8',
                    borderTop: '2px solid #fed7aa' });

  html += section('Прибыль',               profitP,  profitF,
                  { italic: true, color: '#15803d',
                    bg: '#f0fdf4', bg2: '#e8faef', bg3: '#dcfce7',
                    borderTop: '2px solid #bbf7d0' });

  html += section('Налог на прибыль',      taxP,     taxF,
                  { bg: '#fafafa', bg2: '#f5f5f5', bg3: '#efefef' });

  html += section('Чистая прибыль',        netProfP, netProfF,
                  { italic: true, color: '#166534',
                    bg: '#ecfdf5', bg2: '#d1fae5', bg3: '#a7f3d0',
                    borderTop: '2px solid #6ee7b7' });

  html += '</tbody></table>';

  // Сноски
  html += '<div style="margin-top:8px;font-size:10px;color:#9ca3af;line-height:1.6">';
  html += '<strong>план (бюджет)</strong> = факт прошлых месяцев + plan_money текущего/будущих — ';
  html += 'совпадает с колонкой «Бюджет» виджета Бюджет.<br>';
  html += '¹ <em>Наценка за вычетом НДС</em> = Наценка без НДС. ';
  html += 'Остаток на 01.01.2024 будет добавлен после уточнения.<br>';
  html += '² <em>Админ</em> = расходы проектов 24 (ВСИП Общие) и 26 (ТТ Общие). ';
  html += 'Налог на прибыль не заполнен. Детализация Админ — скрытые строки, будут добавлены позже.';
  html += '</div>';

  return html;
}

// ── СТАТУС ────────────────────────────────────────────────────────────────────

function setStatus(msg) {
  var el = document.getElementById('status');
  if (el) el.innerHTML = msg;
}

// ── КЭШ ДАННЫХ ───────────────────────────────────────────────────────────────

var _cats = null, _plans = null, _txns = null, _pls = null;

function getEndDate() {
  var el = document.getElementById('end-date');
  if (el && el.value) return el.value;
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function render() {
  if (!_cats || !_plans || !_txns || !_pls) return;
  var endDate = getEndDate();
  setStatus('&#9679; расчёт...');
  try {
    var agg  = aggregate(_plans, _txns, _pls, _cats, endDate);
    var html = buildTable(agg);
    document.getElementById('content').innerHTML = html;
    var dt = endDate.split('-').reverse().join('.');
    setStatus('&#9679; данные на ' + dt);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div style="color:#dc2626;padding:20px">Ошибка расчёта: ' + e.message + '</div>';
    setStatus('&#9679; ошибка');
    console.error(e);
  }
}

function loadData() {
  document.getElementById('content').innerHTML =
    '<div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>';
  setStatus('&#9679; загрузка категорий...');

  // Параллельная загрузка категорий и плана
  Promise.all([
    fetchAll('categories').then(function (items) {
      var map = {};
      items.forEach(function (c) { map[c.id] = c.name || ''; });
      _cats = map;
    }),
    fetchAll('plan_money').then(function (items) {
      _plans = items;
    })
  ])
  .then(function () {
    setStatus('&#9679; загрузка транзакций...');
    return fetchAll('transaction');
  })
  .then(function (items) {
    _txns = items;
    setStatus('&#9679; загрузка НДС (PLS)...');
    return fetchAll('transaction_pls').catch(function () { return []; });
  })
  .then(function (pls) {
    _pls = pls || [];
    render();
  })
  .catch(function (e) {
    document.getElementById('content').innerHTML =
      '<div style="color:#dc2626;padding:20px">Ошибка загрузки: ' + e.message + '</div>';
    setStatus('&#9679; ошибка загрузки');
    console.error(e);
  });
}

// ── ИНИЦИАЛИЗАЦИЯ ─────────────────────────────────────────────────────────────

(function init() {
  // Устанавливаем дату по умолчанию = сегодня
  var d = new Date();
  var today = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');

  var selDate = document.getElementById('end-date');
  if (selDate) {
    selDate.value = today;
    selDate.addEventListener('change', function () { render(); });
  }

  document.getElementById('refresh-btn').addEventListener('click', function () {
    _cats = _plans = _txns = _pls = null;
    loadData();
  });

  loadData();
}());

})();
</script>
