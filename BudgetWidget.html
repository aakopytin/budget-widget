<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бюджет 2</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 11px;
  background: #f8f9fd;
  padding: 12px;
}
.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}
.title { font-size: 14px; font-weight: 700; color: #111827; }
.sub   { font-size: 10px; color: #9ca3af; margin-left: 8px; }
#status { font-size: 10.5px; color: #d97706; }
#refresh-btn {
  background: none; border: 1px solid #d1d5db; color: #6b7280;
  font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
}
#refresh-btn:hover { background: #f3f4f6; }
#content { overflow-x: auto; }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <span class="title">&#128202; Бюджет проектов</span>
    <span class="sub">С 01.01.2024 · суммы в тыс. руб.</span>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="status">&#9679; инициализация...</span>
    <input type="date" id="end-date"
      style="font-size:11px;border:1px solid #d1d5db;border-radius:4px;
             padding:2px 6px;color:#374151;background:#fff;cursor:pointer"
      title="Дата отчёта (факт учитывается до этой даты)">
    <button id="refresh-btn" title="Обновить">&#8635;</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
'use strict';

// ── КОНФИГУРАЦИЯ ─────────────────────────────────────────────────────────────

var START_DATE = '2024-01-01';

// Колонки проектов: pids — множество project_id из Аспро
// Порядок соответствует виджету Бюджет.
// null = catch-all: всё, что не попало в другие колонки и не Админ/Исключения.
// Примечание: pid=17 числится в двух колонках («Прочие РСХБ» и «Проекты без договора»).
// Разделение производится по наименованию транзакции в aggregate() через isBezDogovora().
var PROJ_COLS = [
  { name: 'Сахалин',              pids: { 3: 1 } },          // Южно-Сахалинск
  { name: 'Голутвинский',         pids: { 33: 1 } },
  { name: 'Барнаул',              pids: { 13: 1 } },
  { name: 'Кемерово',             pids: { 1: 1 } },
  { name: 'Киров',                pids: { 12: 1 } },
  { name: 'Сыктывкар',            pids: { 23: 1 } },
  { name: 'Гарпия',               pids: { 22: 1 } },
  { name: 'ЦДА',                  pids: { 2:1, 4:1, 5:1, 6:1, 7:1, 9:1, 10:1, 34:1 } }, // проекты с «ЦДА» в названии
  { name: 'Прочие РСХБ',          pids: { 17: 1 } },          // pid=17 за вычетом «без договора»
  { name: 'Проекты без договора', pids: { 17: 1 } },          // pid=17: «РСХБ лифты» + «РСХБ Петрозаводск» по наименованию
  { name: 'Прочие проекты',       pids: null }                // catch-all
];

// Накладные расходы (Офис / Админ) — проекты 24 и 26
var ADMIN_PIDS = { 24: 1, 26: 1 };

// Проекты, полностью исключённые из виджета (не входят ни в одну колонку):
// 25=Типовой (шаблон), 27=Трансферы, 28=Проект СМ, 35=Внепроектные, 36=Корректировки НДС
var EXCL_PIDS = { 25:1, 27:1, 28:1, 35:1, 36:1 };

// Справочник названий проектов (из st/projects)
var PROJ_NAME_MAP = {
  1:'Кемерово', 2:'Рассказово', 3:'Южно-Сахалинск', 4:'Омутнинск',
  5:'Строитель', 6:'Десногорск', 7:'Иволгинск', 8:'ОКО',
  9:'Рузаевка', 10:'Большое Болдино', 11:'Новокуйбышевск', 12:'Киров',
  13:'Барнаул', 14:'Тамбов', 15:'Одинцово', 16:'Покровское',
  17:'Анадырь', 18:'Уни', 19:'Красногорское', 20:'Чечня',
  21:'Сити', 22:'Москва (Новгородская)', 23:'Сыктывкар',
  24:'ВСИП Общие', 25:'Типовой', 26:'ТТ Общие',
  27:'Трансферы', 28:'Проект СМ', 29:'Первомайское', 30:'Угловское',
  31:'Тогул', 32:'Менжинского', 33:'Голутвинский', 34:'Толбазы',
  35:'Прочие/Закрытые', 36:'Корректировки НДС'
};

// Белый список счетов — идентично Budget1 (VSIP_ACC_IDS + TT_ACC_IDS).
// Исключает технические записи org_id=3 (Бюджетный лимит, account 36),
// которые хранят плановые значения, а не реальное движение денег.
var VSIP_ACC_IDS = {2:1, 3:1, 4:1, 5:1, 6:1, 7:1, 8:1, 161:1, 166:1};
var TT_ACC_IDS   = {18:1};

// Совокупность явно именованных project_id (для определения «Прочих»)
var NAMED_PIDS = {};
PROJ_COLS.forEach(function (c) {
  if (c.pids) Object.keys(c.pids).forEach(function (id) { NAMED_PIDS[+id] = 1; });
});

// Индексы колонок pid=17 — для разделения «Прочие РСХБ» и «Проекты без договора»
var RSKHB_COL = -1, BEZDOG_COL = -1;
PROJ_COLS.forEach(function (c, i) {
  if (c.name === 'Прочие РСХБ')          RSKHB_COL = i;
  if (c.name === 'Проекты без договора')  BEZDOG_COL = i;
});

// «Без договора»: pid=17 с наименованием, содержащим «Петрозавод» или «лифт»
var BEZDOG_RE = /петрозавод|лифт/i;
function isBezDogovora(name) {
  return BEZDOG_COL >= 0 && !!name && BEZDOG_RE.test(name);
}

// Категории-переводы и займы — исключаем полностью
var SKIP_CAT_NAMES = {
  'Перевод между счетами (поступление)': 1,
  'Перевод между счетами (списание)': 1,
  'Получение кредита': 1, 'Выплата кредита': 1,
  'Получение займа': 1,  'Выплата займа': 1,
};

// Категории доходов (выручка от основной деятельности)
var INC_CAT_NAMES = {
  'Оказание услуг': 1,
  'Возврат ДС. за заказы': 1,
  'Проценты к получению': 1,
  'Прочий доход': 1,
  'Возврат депозита': 1
};

// category_id-коды НДС — обрабатываются отдельно через PLS
var VAT_CAT_IDS = { 3157: 1, 3158: 1, 3144: 1, 3147: 1 };

// Admin sub-category ID sets
var ADMIN_FOT_IDS  = {9:1, 10:1, 11:1};   // Зарплата + Налоги с зарплаты
var ADMIN_TRIP_IDS = {7:1};                // Командировки
var ADMIN_BUH_IDS  = {17:1};              // Бухгалтерия
var ADMIN_INT_IDS  = {1008:1};            // Проценты к уплате
var ADMIN_EXCL_IDS = {1009:1};            // Налог на прибыль — исключить из Админ

// Производственные расходы по имени категории
function isProdExpense(catName) {
  if (!catName || SKIP_CAT_NAMES[catName]) return false;
  var l = catName.toLowerCase();
  return (
    l.indexOf('материал') === 0 ||
    l.indexOf('смр') === 0 ||
    (l.indexOf('банков') >= 0 && l.indexOf('гарант') >= 0) ||
    l.indexOf('проектирован') >= 0 ||
    l.indexOf('изыскан') >= 0 ||
    l.indexOf('оборудован') >= 0 ||
    l.indexOf('мобилизац') >= 0 ||
    catName === 'Командировки' ||
    catName === 'Составление исполнительной документации' ||
    catName === 'Услуги по сертификации' ||
    catName === 'Тесты и испытания'
  );
}

// Ставки планового НДС — идентично виджету Бюджет (getPlanExpVatRate / effRates).
// Нет переключения по дате: ставки фиксированные, как в Budget1.
function planExpVatRate(catName) {
  if (!catName) return 0;
  var l = catName.toLowerCase();
  // «...без НДС» в названии → ставка 0 (как в Budget1 getExpCatType)
  if (l.indexOf('без ндс') >= 0) return 0;
  // Нулевая ставка: категории без НДС (ZERO_RATE_CATS из Budget1)
  if (catName === 'Командировки' ||
      catName === 'Составление исполнительной документации' ||
      catName === 'Услуги по сертификации' ||
      catName === 'Тесты и испытания')              return 0;
  if (l.indexOf('проектирован') >= 0 ||
      l.indexOf('изыскан') >= 0)                    return 0;
  if (l.indexOf('банков') >= 0 &&
      l.indexOf('гарант') >= 0)                     return 0;
  // proj_other в Budget1 → DEFAULT_EFF_RATE = 0
  if (l.indexOf('оборудован') >= 0 ||
      l.indexOf('мобилизац') >= 0)                  return 0;
  // СМР: 5/105 (жёстко, как в Budget1 effRates['smr'])
  if (l.indexOf('смр') === 0)                       return 5 / 105;
  // Материалы, Возвраты клиентам, default: 22/122 (как в Budget1 effRates['mat']/'ret')
  return 22 / 122;
}

// Плановая выручка: 22/122 (как в Budget1 шаг 5a)
function planRevVatRate() {
  return 22 / 122;
}

// ── API ───────────────────────────────────────────────────────────────────────

function fetchAll(entity) {
  var all = [], page = 1;
  function next() {
    var url = '/api/data?entity=' + entity + '&limit=100&page=' + page;
    return fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error).slice(0, 80));
        var items = (d.response && d.response.items) || [];
        all = all.concat(items);
        var total = (d.response && d.response.total) || 0;
        setStatus('&#9679; ' + entity + ': ' + all.length + ' / ' + total);
        if (all.length >= total || items.length < 100) return all;
        page++;
        return next();
      });
  }
  return next();
}

// ── АГРЕГАЦИЯ ─────────────────────────────────────────────────────────────────

var NC = PROJ_COLS.length + 1; // Всего + 8 колонок проектов

function newArr() {
  var a = [];
  for (var i = 0; i < NC; i++) a.push(0);
  return a;
}

// Возвращает индекс колонки проекта (0..NC-2) или -1 (Админ/пропуск)
// Колонка Всего — индекс 0 в итоговых массивах (добавляется отдельно)
function colIdx(projId) {
  var pid = projId ? +projId : 0;
  if (pid && ADMIN_PIDS[pid]) return -1;
  for (var i = 0; i < PROJ_COLS.length - 1; i++) {
    if (PROJ_COLS[i].pids && pid && PROJ_COLS[i].pids[pid]) return i;
  }
  // Прочие = последняя колонка проектов
  if (!pid || !NAMED_PIDS[pid]) return PROJ_COLS.length - 1;
  return -1;
}

// Добавляет v в массив: [0]=Всего, [ci+1]=проект
function addV(arr, ci, v) {
  arr[0] += v;
  arr[ci + 1] += v;
}

function aggregate(plans, txns, plsItems, catMap, endDate) {
  // Точка разреза: начало текущего месяца по выбранной дате.
  // Строка «план» (Бюджет) = факт прошлых месяцев + plan_money текущего и будущих.
  // Это повторяет логику колонки «Бюджет» в виджете Бюджет.
  var curMonthStart = endDate.slice(0, 7) + '-01';

  var revP     = newArr(), revF     = newArr();
  var costP    = newArr(), costF    = newArr();
  var vatRevP  = newArr(), vatRevF  = newArr();
  var vatCostP = newArr(), vatCostF = newArr();
  var taxP = 0, taxF = 0;
  var adminFotP=0, adminFotF=0;
  var adminTripP=0, adminTripF=0;
  var adminBuhP=0, adminBuhF=0;
  var adminIntP=0, adminIntF=0;
  var adminOthP=0, adminOthF=0;
  var prochByPid = {};
  function getProchPP(pid) {
    var k = (pid || 0) + '';
    if (!prochByPid[k]) prochByPid[k] = {revP:0,revF:0,costP:0,costF:0,vatRevP:0,vatRevF:0,vatCostP:0,vatCostF:0};
    return prochByPid[k];
  }

  // Карта plan_money_id → наименование.
  // Для pid=17 фактические транзакции имеют пустое поле name — реальное название
  // хранится в связанной записи plan_money. Карта нужна для isBezDogovora().
  var pmNameMap = {};
  // Карта plan_money_id → plan_paid_date.
  // PLS-записи НДС создаются в Аспро по дате выставления счёта/акта, которая может
  // не совпадать с датой банковской транзакции. Для корректного isPastP используем
  // дату plan_money, а не дату самой PLS-записи.
  var pmDateMap = {};
  plans.forEach(function(item) {
    if (item.name) pmNameMap[item.id] = item.name;
    if (item.plan_paid_date) pmDateMap[item.id] = item.plan_paid_date;
  });

  // ─── 1. Транзакции (факт + исторический план) ────────────────────────────
  txns.forEach(function (tx) {
    var dt = tx.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    // Только реальные банковские счета ВСИП и ТТ (идентично Budget1)
    var acct = tx.org_account_id;
    if (!VSIP_ACC_IDS[acct] && !TT_ACC_IDS[acct]) return;
    var catName = catMap[tx.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;
    if (VAT_CAT_IDS[tx.category_id]) return;

    var incAmt = parseFloat(tx.income)  || 0;
    var expAmt = parseFloat(tx.outcome) || 0;
    var isPast = (dt < curMonthStart);  // прошлые месяцы входят в Бюджет

    if (EXCL_PIDS[tx.project_id]) return;  // полностью исключённые проекты

    // Налог на прибыль — отдельная строка, не входит в Админ
    if (tx.category_id === 1009) {
      if (expAmt) { taxF += expAmt; if (isPast) taxP += expAmt; }
      return;
    }

    if (ADMIN_PIDS[tx.project_id]) {
      if (expAmt && !ADMIN_EXCL_IDS[tx.category_id]) {
        var cid4 = tx.category_id;
        if      (ADMIN_FOT_IDS[cid4])  { adminFotF  += expAmt; if (isPast) adminFotP  += expAmt; }
        else if (ADMIN_TRIP_IDS[cid4]) { adminTripF += expAmt; if (isPast) adminTripP += expAmt; }
        else if (ADMIN_BUH_IDS[cid4])  { adminBuhF  += expAmt; if (isPast) adminBuhP  += expAmt; }
        else if (ADMIN_INT_IDS[cid4])  { adminIntF  += expAmt; if (isPast) adminIntP  += expAmt; }
        else                           { adminOthF  += expAmt; if (isPast) adminOthP  += expAmt; }
      }
      return;
    }

    var ci = colIdx(tx.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию plan_money (tx.name всегда пусто для pid=17)
    if (ci === RSKHB_COL) {
      var pmNameTx = pmNameMap[tx.plan_money_id] || tx.name || tx.description || tx.comment || '';
      if (isBezDogovora(pmNameTx)) ci = BEZDOG_COL;
    }
    // Прочие проекты: расходные транзакции с «Лифты»/«Петрозаводск»
    // в описании или наименовании plan_money → «Проекты без договора»
    if (ci === PROJ_COLS.length - 1) {
      var prochNameTx = tx.description || tx.name || tx.comment || pmNameMap[tx.plan_money_id] || '';
      if (isBezDogovora(prochNameTx)) ci = BEZDOG_COL;
    }

    // «Возвраты клиентам» учитываются в себестоимости Прочих — идентично Budget1,
    // где isExpense возвращает true для этой категории при proj === 'Прочие'/'Прочие/Закрытые'.
    var isProch  = (ci === PROJ_COLS.length - 1);
    // Для Прочих: все расходные транзакции включаются в себестоимость
    // (аналогично plan_money, где ВСЕ type=40 попадают в costP)
    var isExp    = isProdExpense(catName) || isProch;

    // Факт (все транзакции ≤ endDate)
    if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revF, ci, incAmt);
    if (expAmt && isExp)                       addV(costF, ci, expAmt);

    // Историческая часть плана (прошлые месяцы: факт = план)
    if (isPast) {
      if (incAmt > 0 && INC_CAT_NAMES[catName]) addV(revP, ci, incAmt);
      if (expAmt && isExp)                       addV(costP, ci, expAmt);
    }
    // Детализация «Прочих» по project_id
    if (isProch) {
      var ppTx = getProchPP(tx.project_id);
      if (incAmt > 0 && INC_CAT_NAMES[catName]) { ppTx.revF += incAmt; if (isPast) ppTx.revP += incAmt; }
      if (expAmt && isExp)                       { ppTx.costF += expAmt; if (isPast) ppTx.costP += expAmt; }
    }
  });

  // ─── 2. PLS: выделенный НДС факт (идентично Budget1 calcVatForecast шаги 4a/4b) ──
  // cat=3147 (Налог-НДС, income)   → vatRevF/vatRevP  (НДС начисленный на доходы)
  // cat=3144 (Налоги-НДС, outcome) → vatCostF/vatCostP (НДС к вычету по расходам)
  // Одинаковая логика для 2025 и 2026 — «по выделенному из транзакций НДС».
  plsItems.forEach(function (p) {
    var dt = p.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    var acctP = p.org_account_id;
    if (acctP && !VSIP_ACC_IDS[acctP] && !TT_ACC_IDS[acctP]) return;
    if (EXCL_PIDS[p.project_id]) return;
    var ci = colIdx(p.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию plan_money
    if (ci === RSKHB_COL) {
      var pmNamePls = pmNameMap[p.plan_money_id] || p.name || p.description || '';
      if (isBezDogovora(pmNamePls)) ci = BEZDOG_COL;
    }
    // Прочие проекты: PLS с «Лифты»/«Петрозаводск» → «Проекты без договора»
    if (ci === PROJ_COLS.length - 1) {
      var prochNamePls = p.description || p.name || pmNameMap[p.plan_money_id] || '';
      if (isBezDogovora(prochNamePls)) ci = BEZDOG_COL;
    }
    // isPastP: используем дату plan_money (когда признан доход/расход), а не дату PLS.
    // PLS-записи в Аспро могут быть созданы позже (например, при выставлении акта),
    // тогда как сам доход уже проведён в прошлом периоде. Без этой коррекции
    // vatRevF включает «старые» PLS с текущей датой, vatRevP — нет → Plan ≠ Fact без НДС.
    var plsRefDate = (p.plan_money_id && pmDateMap[p.plan_money_id]) || dt;
    var isPastP = (plsRefDate < curMonthStart);

    if (p.category_id === 3147) {                    // НДС начисленный (доходы)
      var vIn = (parseFloat(p.income) || 0) - (parseFloat(p.outcome) || 0);
      addV(vatRevF, ci, vIn);
      if (isPastP) addV(vatRevP, ci, vIn);
      if (ci === PROJ_COLS.length - 1) { var ppPls = getProchPP(p.project_id); ppPls.vatRevF += vIn; if (isPastP) ppPls.vatRevP += vIn; }
    } else if (p.category_id === 3144) {             // НДС к вычету (расходы)
      var vOut = (parseFloat(p.outcome) || 0) - (parseFloat(p.income) || 0);
      addV(vatCostF, ci, vOut);
      if (isPastP) addV(vatCostP, ci, vOut);
      if (ci === PROJ_COLS.length - 1) { var ppPls = getProchPP(p.project_id); ppPls.vatCostF += vOut; if (isPastP) ppPls.vatCostP += vOut; }
    }
  });

  // ─── 3. Plan_money: только текущий месяц и будущие (org_account_id=36) ───
  plans.forEach(function (item) {
    if (item.org_account_id !== 36) return;
    var dt = item.plan_paid_date || '';
    if (!dt || dt < curMonthStart) return;          // только тек. месяц+будущее
    var val     = parseFloat(item.total) || 0;
    var catName = catMap[item.category_id] || '';
    if (SKIP_CAT_NAMES[catName]) return;

    if (EXCL_PIDS[item.project_id]) return;  // полностью исключённые проекты

    // Налог на прибыль — план
    if (item.category_id === 1009) {
      if (item.type === 40) taxP += val;
      return;
    }

    if (ADMIN_PIDS[item.project_id]) {
      if (item.type === 40 && !ADMIN_EXCL_IDS[item.category_id]) {
        var cid5 = item.category_id;
        if      (ADMIN_FOT_IDS[cid5])  adminFotP  += val;
        else if (ADMIN_TRIP_IDS[cid5]) adminTripP += val;
        else if (ADMIN_BUH_IDS[cid5])  adminBuhP  += val;
        else if (ADMIN_INT_IDS[cid5])  adminIntP  += val;
        else                           adminOthP  += val;
      }
      return;
    }

    var ci = colIdx(item.project_id);
    if (ci < 0) return;
    // pid=17: перераспределить по наименованию плановой заявки
    if (ci === RSKHB_COL && isBezDogovora(item.name || item.description || '')) ci = BEZDOG_COL;

    if (item.type === 30) {                         // доходы
      var rvr = planRevVatRate();
      addV(revP, ci, val);
      addV(vatRevP, ci, Math.round(val * rvr));
      if (ci === PROJ_COLS.length - 1) { var ppPM = getProchPP(item.project_id); ppPM.revP += val; ppPM.vatRevP += Math.round(val * rvr); }
    } else if (item.type === 40) {                  // расходы
      // Budget1 включает ВСЕ plan_money type=40 в be_plan без фильтра по категории.
      // isProdExpense применяется только к фактическим транзакциям, не к plan_money.
      addV(costP, ci, val);
      // НДС на plan_money: производственные категории + «Возвраты клиентам» в Прочих
      var isProchPM = (ci === PROJ_COLS.length - 1);
      if (isProdExpense(catName) || (isProchPM && catName === 'Возвраты клиентам')) {
        addV(vatCostP, ci, Math.round(val * planExpVatRate(catName)));
      }
      if (isProchPM) {
        var ppPM = getProchPP(item.project_id);
        ppPM.costP += val;
        if (isProdExpense(catName) || catName === 'Возвраты клиентам') ppPM.vatCostP += Math.round(val * planExpVatRate(catName));
      }
    }
  });

  return {
    revP: revP, revF: revF,
    costP: costP, costF: costF,
    vatRevP: vatRevP,   vatRevF: vatRevF,
    vatCostP: vatCostP, vatCostF: vatCostF,
    adminFotP: adminFotP,   adminFotF: adminFotF,
    adminTripP: adminTripP, adminTripF: adminTripF,
    adminBuhP: adminBuhP,   adminBuhF: adminBuhF,
    adminIntP: adminIntP,   adminIntF: adminIntF,
    adminOthP: adminOthP,   adminOthF: adminOthF,
    taxP: taxP, taxF: taxF,
    adminP: adminFotP+adminTripP+adminBuhP+adminIntP+adminOthP,
    adminF: adminFotF+adminTripF+adminBuhF+adminIntF+adminOthF,
    prochByPid: prochByPid
  };
}

// ── РАСШИФРОВКА ПРОЧИХ ────────────────────────────────────────────────────────
function buildProchTable(prochByPid) {
  var pids = Object.keys(prochByPid).map(Number).filter(function(pid) {
    var pp = prochByPid[pid];
    return pp.revP || pp.revF || pp.costP || pp.costF;
  }).sort(function(a, b) { return a - b; });
  if (!pids.length) return '';

  var nExtra = pids.length;
  var CS2 = 'padding:4px 8px;background:#f0f4f9;border-bottom:2px solid #3d5c7a;' +
            'font-size:10px;font-weight:600;white-space:nowrap;text-align:right;color:#374151;';
  var BD2 = 'border-bottom:1px solid #f0f0f0;';
  var TD  = 'padding:2px 8px;font-size:11px;text-align:right;white-space:nowrap;';

  var h = '<details style="margin-top:18px">';
  h += '<summary style="cursor:pointer;font-weight:600;font-size:11px;color:#3d5c7a;' +
       'padding:6px 2px;user-select:none;list-style:none">' +
       '&#9660;&nbsp;Расшифровка «Прочие проекты» по проектам &mdash; Выручка / Себестоимость / Наценка</summary>';
  h += '<div style="overflow-x:auto;margin-top:6px">';
  h += '<table style="border-collapse:collapse;font-size:11px;width:100%">';

  // Header
  h += '<thead><tr>';
  h += '<th style="' + CS2 + 'text-align:left;min-width:180px">Показатель</th>';
  h += '<th style="' + CS2 + ';min-width:50px;color:#6b7280">Строка</th>';
  h += '<th style="' + CS2 + ';min-width:80px">Итого</th>';
  pids.forEach(function(pid) {
    var pname = PROJ_NAME_MAP[pid] || ('Пр. ' + pid);
    h += '<th style="' + CS2 + ';min-width:80px">' + pname + '</th>';
  });
  h += '</tr></thead><tbody>';

  // ── Helper: emit 3 sub-rows (план / факт / остаток) for one section ────────
  function emitSect(label, italic, color, bg, bgF, bgO, getP, getF) {
    var totalP = 0, totalF = 0;
    pids.forEach(function(pid) { totalP += getP(prochByPid[pid]); totalF += getF(prochByPid[pid]); });
    var totalO = totalP - totalF;

    var lblStyle = 'padding:2px 8px;font-size:11px;white-space:nowrap;' +
                   (italic ? 'font-style:italic;' : '') +
                   (color  ? 'color:' + color + ';' : '') + 'font-weight:600;';

    // план
    h += '<tr>';
    h += '<td rowspan="3" style="' + lblStyle + 'background:' + bg  + ';border-bottom:2px solid #e5e7eb;">' + label + '</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';color:#6b7280">план</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bg  + ';font-weight:600">' + fmtK(totalP, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + BD2 + 'background:' + bg  + '">' + fmtK(getP(prochByPid[pid])) + '</td>'; });
    h += '</tr>';
    // факт
    h += '<tr>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';color:#6b7280">факт</td>';
    h += '<td style="' + TD + BD2 + 'background:' + bgF + ';font-weight:600">' + fmtK(totalF, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + BD2 + 'background:' + bgF + '">' + fmtK(getF(prochByPid[pid])) + '</td>'; });
    h += '</tr>';
    // остаток
    h += '<tr>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';color:#6b7280">остаток</td>';
    h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + ';font-weight:600">' + fmtOst(totalO, true) + '</td>';
    pids.forEach(function(pid) { h += '<td style="' + TD + 'border-bottom:2px solid #e5e7eb;background:' + bgO + '">' + fmtOst(getP(prochByPid[pid]) - getF(prochByPid[pid])) + '</td>'; });
    h += '</tr>';
  }

  function gap2() {
    h += '<tr><td colspan="' + (nExtra + 3) + '" style="height:6px;background:#f8f9fd"></td></tr>';
  }

  // ── с НДС ──
  var BW = '#ffffff', BF2 = '#fafbff', BO2 = '#f8fdf9';
  var BM = '#f0f7ff', BMF = '#e8f2ff', BMO = '#dceeff';
  emitSect('Выручка с НДС',      false, null,      BW,  BF2, BO2, function(pp){return pp.revP;},  function(pp){return pp.revF;});
  emitSect('Себестоимость с НДС',false, null,      BW,  BF2, BO2, function(pp){return pp.costP;}, function(pp){return pp.costF;});
  emitSect('Наценка с НДС',      true,  '#1e40af', BM,  BMF, BMO,
    function(pp){return pp.revP - pp.costP;},
    function(pp){return pp.revF - pp.costF;});
  gap2();
  // ── без НДС ──
  emitSect('Выручка без НДС',      false, null,      BW,  BF2, BO2, function(pp){return pp.revP  - pp.vatRevP;},  function(pp){return pp.revF  - pp.vatRevF;});
  emitSect('Себестоимость без НДС',false, null,      BW,  BF2, BO2, function(pp){return pp.costP - pp.vatCostP;}, function(pp){return pp.costF - pp.vatCostF;});
  emitSect('Наценка без НДС',      true,  '#1e40af', BM,  BMF, BMO,
    function(pp){return (pp.revP-pp.vatRevP)-(pp.costP-pp.vatCostP);},
    function(pp){return (pp.revF-pp.vatRevF)-(pp.costF-pp.vatCostF);});

  h += '</tbody></table></div></details>';
  return h;
}

// ── ФОРМАТИРОВАНИЕ ────────────────────────────────────────────────────────────

function fmtK(v, bold) {
  if (v === null || v === undefined) return '<span style="color:#ccc">—</span>';
  if (v === 0) return '<span style="color:#9ca3af">0</span>';
  var abs  = Math.abs(v) / 1000;
  var s    = abs.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  var neg  = v < 0;
  var txt  = neg ? '(' + s + ')' : s;
  if (neg)  return bold ? '<strong style="color:#dc2626">' + txt + '</strong>'
                        : '<span style="color:#dc2626">' + txt + '</span>';
  return bold ? '<strong>' + txt + '</strong>' : txt;
}

function fmtOst(v, bold) {
  if (v === null || v === undefined) return '<span style="color:#ccc">—</span>';
  if (v === 0) return '<span style="color:#9ca3af">0</span>';
  var abs  = Math.abs(v) / 1000;
  var s    = abs.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  var neg  = v < 0;
  var txt  = neg ? '(' + s + ')' : s;
  var clr  = neg ? '#dc2626' : '#059669';
  return bold ? '<strong style="color:' + clr + '">' + txt + '</strong>'
              : '<span style="color:' + clr + '">' + txt + '</span>';
}

// ── ТАБЛИЦА ───────────────────────────────────────────────────────────────────

function buildTable(agg) {

  // Вспомогательные операции над массивами длиной NC
  function vsub(a, b) { return a.map(function (v, i) { return v - b[i]; }); }
  function ext1(val)  {
    // Только Всего (индекс 0), остальные = 0
    var a = [val];
    for (var i = 1; i < NC; i++) a.push(0);
    return a;
  }

  // ─── Вычисляемые строки ───────────────────────────────────────────────────
  var revNetP   = vsub(agg.revP,  agg.vatRevP);
  var revNetF   = vsub(agg.revF,  agg.vatRevF);
  var costNetP  = vsub(agg.costP, agg.vatCostP);
  var costNetF  = vsub(agg.costF, agg.vatCostF);

  var markGrossP = vsub(agg.revP,   agg.costP);
  var markGrossF = vsub(agg.revF,   agg.costF);
  var markNetP   = vsub(revNetP,    costNetP);
  var markNetF   = vsub(revNetF,    costNetF);

  // Админ: только в колонке «Всего»
  var adminProw    = ext1(agg.adminP);
  var adminFrow    = ext1(agg.adminF);
  var adminFotProw  = ext1(agg.adminFotP);
  var adminFotFrow  = ext1(agg.adminFotF);
  var adminTripProw = ext1(agg.adminTripP);
  var adminTripFrow = ext1(agg.adminTripF);
  var adminBuhProw  = ext1(agg.adminBuhP);
  var adminBuhFrow  = ext1(agg.adminBuhF);
  var adminIntProw  = ext1(agg.adminIntP);
  var adminIntFrow  = ext1(agg.adminIntF);
  var adminOthProw  = ext1(agg.adminOthP);
  var adminOthFrow  = ext1(agg.adminOthF);

  // Прибыль = Наценка без НДС − Админ
  var profitP    = vsub(markNetP, adminProw);
  var profitF    = vsub(markNetF, adminFrow);

  // Налог на прибыль — факт + plan_money по кат. 1009
  var taxP       = ext1(agg.taxP);
  var taxF       = ext1(agg.taxF);

  // Чистая прибыль = Прибыль − Налог
  var netProfP   = vsub(profitP, taxP);
  var netProfF   = vsub(profitF, taxF);

  // ─── HTML-хелперы ─────────────────────────────────────────────────────────
  var CS = 'padding:5px 8px;border-bottom:2px solid #3d5c7a;font-size:10px;' +
           'font-weight:600;white-space:nowrap;background:#f0f4f9;color:#374151;';
  var BD = 'border-bottom:1px solid #f0f0f0;';
  var BG_W   = '#ffffff';
  var BG_F   = '#fafbff';
  var BG_OST = '#f8fdf9';
  var BG_GAP = '#f8f9fd';

  function th(v, align, width) {
    var w = width ? 'width:' + width + ';min-width:' + width + ';' : '';
    return '<th style="' + CS + w + 'text-align:' + (align || 'right') + '">' + v + '</th>';
  }
  function tdV(v, bg, extra) {
    return '<td style="padding:2px 8px;text-align:right;white-space:nowrap;' +
           BD + 'background:' + bg + ';' + (extra || '') + '">' + v + '</td>';
  }
  function tdL(v, bg, extra) {
    return '<td style="padding:2px 8px;white-space:nowrap;' +
           BD + 'background:' + bg + ';' + (extra || '') + '">' + v + '</td>';
  }

  // Одна секция (три строки: план / факт / остаток)
  // opts.totalOnly = true → только колонка Всего (для Админ и ниже)
  function section(label, pVals, fVals, opts) {
    opts = opts || {};
    var bg1 = opts.bg  || BG_W;
    var bg2 = opts.bg2 || BG_F;
    var bg3 = opts.bg3 || BG_OST;
    var bot3 = 'border-bottom:2px solid #e5e7eb;';
    var totalOnly = !!opts.totalOnly;
    var nProj = PROJ_COLS.length;

    var labelStyle = 'font-size:10px;font-weight:600;color:' +
                     (opts.color || '#374151') +
                     (opts.italic ? ';font-style:italic' : '');

    var oVals = vsub(pVals, fVals);
    var html  = '';

    function projCells(bg, extra) {
      var s = '';
      for (var ii = 0; ii < nProj; ii++)
        s += '<td style="padding:2px 8px;' + BD + 'background:' + bg + ';' + (extra || '') + '"></td>';
      return s;
    }

    // Строка «план»
    html += '<tr>';
    html += tdL('<span style="' + labelStyle + '">' + label + '</span>', bg1,
                'border-top:' + (opts.borderTop || '1px solid #f0f0f0'));
    html += tdL('<span style="font-size:10px;color:#6b7280">план (бюджет)</span>', bg1);
    if (totalOnly) {
      html += tdV(fmtK(pVals[0], true), bg1, 'font-weight:600');
      html += projCells(bg1);
    } else {
      pVals.forEach(function (v, i) {
        html += tdV(fmtK(v, i === 0), bg1, i === 0 ? 'font-weight:600' : '');
      });
    }
    html += '</tr>';

    // Строка «факт»
    html += '<tr>';
    html += tdL('', bg2);
    html += tdL('<span style="font-size:10px;color:#6b7280">факт</span>', bg2);
    if (totalOnly) {
      html += tdV(fmtK(fVals[0], true), bg2, 'font-weight:600');
      html += projCells(bg2);
    } else {
      fVals.forEach(function (v, i) {
        html += tdV(fmtK(v, i === 0), bg2, i === 0 ? 'font-weight:600' : '');
      });
    }
    html += '</tr>';

    // Строка «остаток»
    html += '<tr>';
    html += tdL('', bg3, bot3);
    html += tdL('<span style="font-size:10px;color:#6b7280">остаток</span>', bg3, bot3);
    if (totalOnly) {
      html += tdV(fmtOst(oVals[0], true), bg3, bot3 + 'font-weight:600');
      html += projCells(bg3, bot3);
    } else {
      oVals.forEach(function (v, i) {
        html += tdV(fmtOst(v, i === 0), bg3,
                    bot3 + (i === 0 ? 'font-weight:600' : ''));
      });
    }
    html += '</tr>';

    return html;
  }

  function gap() {
    return '<tr><td colspan="' + (NC + 2) + '" style="height:7px;background:' +
           BG_GAP + ';border:none"></td></tr>';
  }

  // Расшифровка Админа по колонкам (аналогично проектам)
  // Единая строка Админ: Всего + подкатегории как колонки (без отдельной строки итого)
  function adminCols() {
    // Бухгалтерия не отображается отдельно — её суммы включены в «Прочие»
    var ADMIN_LABELS = ['ФОТ+Налоги\nна ФОТ', 'Командировки', 'Проценты', 'Прочие'];
    var subP = [agg.adminFotP, agg.adminTripP, agg.adminIntP, agg.adminOthP + agg.adminBuhP];
    var subF = [agg.adminFotF, agg.adminTripF, agg.adminIntF, agg.adminOthF + agg.adminBuhF];
    var totalP = agg.adminP, totalF = agg.adminF;
    var nProj = PROJ_COLS.length;
    var nSub  = ADMIN_LABELS.length;
    var bg1 = '#fff7ed', bg2 = '#fef5ec', bg3 = '#fde8c8';
    var clr = '#92400e';
    var bot3 = 'border-bottom:2px solid #e5e7eb;';
    var bTop = 'border-top:2px solid #fed7aa;';
    var cs   = 'padding:2px 8px;text-align:right;white-space:nowrap;' + BD;
    var lbl  = 'font-size:10px;font-weight:600;color:' + clr;

    function cell(bg, v, extra) {
      return '<td style="' + cs + 'background:' + bg + ';' + (extra||'') + '">' + (v||'') + '</td>';
    }
    function labelCell(bg, v, extra) {
      return '<td style="padding:2px 8px;white-space:nowrap;' + BD + 'background:' + bg + ';' + (extra||'') + '">' + (v||'') + '</td>';
    }
    function subLabel(i) {
      return i < nSub
        ? '<span style="font-size:9px;font-weight:600;color:' + clr + '">' + ADMIN_LABELS[i] + '</span><br>'
        : '';
    }

    var html = '';

    // Строка «план» — с меткой «Админ²» и итогом в Всего
    html += '<tr>';
    html += labelCell(bg1, '<span style="' + lbl + '">Админ²</span>', bTop);
    html += labelCell(bg1, '<span style="font-size:10px;color:#6b7280">план (бюджет)</span>', bTop);
    html += cell(bg1, fmtK(totalP, true), bTop + 'font-weight:600');
    for (var i = 0; i < nProj; i++) {
      html += cell(bg1, subLabel(i) + (i < nSub ? fmtK(subP[i]) : ''), bTop);
    }
    html += '</tr>';

    // Строка «факт»
    html += '<tr>';
    html += labelCell(bg2, '');
    html += labelCell(bg2, '<span style="font-size:10px;color:#6b7280">факт</span>');
    html += cell(bg2, fmtK(totalF, true), 'font-weight:600');
    for (var i = 0; i < nProj; i++) {
      html += cell(bg2, i < nSub ? fmtK(subF[i]) : '');
    }
    html += '</tr>';

    // Строка «остаток»
    html += '<tr>';
    html += labelCell(bg3, '', bot3);
    html += labelCell(bg3, '<span style="font-size:10px;color:#6b7280">остаток</span>', bot3);
    html += cell(bg3, fmtOst(totalP - totalF, true), bot3 + 'font-weight:600');
    for (var i = 0; i < nProj; i++) {
      var v = i < nSub ? subP[i] - subF[i] : null;
      html += cell(bg3, i < nSub ? fmtOst(v) : '', bot3);
    }
    html += '</tr>';

    return html;
  }

  // ─── Шапка таблицы ───────────────────────────────────────────────────────
  // Ширина колонки проекта = «Голутвинский» (~90px); заголовки переносятся по словам.
  var PROJ_COL_W = '72px';
  var CS_PROJ = 'padding:5px 8px;border-bottom:2px solid #3d5c7a;font-size:10px;' +
                'font-weight:600;white-space:normal;word-break:break-word;' +
                'background:#f0f4f9;color:#374151;text-align:center;' +
                'width:' + PROJ_COL_W + ';min-width:' + PROJ_COL_W + ';max-width:' + PROJ_COL_W + ';';
  function thProj(v) {
    return '<th style="' + CS_PROJ + '">' + v + '</th>';
  }
  var html = '<table style="border-collapse:collapse;font-size:10.5px;table-layout:fixed">';
  html += '<thead><tr>';
  html += th('Показатель', 'left',  '140px');
  html += th('&nbsp;',     'left',  '72px');
  html += th('Всего',      'right', PROJ_COL_W);
  PROJ_COLS.forEach(function (c) { html += thProj(c.name); });
  html += '</tr></thead><tbody>';

  // ─── Строки ──────────────────────────────────────────────────────────────
  html += section('Выручка с НДС',        agg.revP,  agg.revF);
  html += section('Себестоимость с НДС',  agg.costP, agg.costF);
  html += section('Наценка с НДС',        markGrossP, markGrossF,
                  { italic: true, color: '#1e40af' });

  html += gap();

  html += section('Выручка без НДС',       revNetP,  revNetF);
  html += section('Себестоимость без НДС', costNetP, costNetF);
  html += section('Наценка без НДС',       markNetP, markNetF,
                  { italic: true, color: '#1e40af' });


  html += gap();

  html += adminCols();

  html += section('Прибыль',               profitP,  profitF,
                  { italic: true, color: '#15803d',
                    bg: '#f0fdf4', bg2: '#e8faef', bg3: '#dcfce7',
                    borderTop: '2px solid #bbf7d0', totalOnly: true });

  html += section('Налог на прибыль',      taxP,     taxF,
                  { bg: '#fafafa', bg2: '#f5f5f5', bg3: '#efefef', totalOnly: true });

  html += section('Чистая прибыль',        netProfP, netProfF,
                  { italic: true, color: '#166534',
                    bg: '#ecfdf5', bg2: '#d1fae5', bg3: '#a7f3d0',
                    borderTop: '2px solid #6ee7b7', totalOnly: true });

  html += '</tbody></table>';

  // Сноски
  html += '<div style="margin-top:8px;font-size:10px;color:#9ca3af;line-height:1.6">';
  html += '<strong>план (бюджет)</strong> = факт прошлых месяцев + plan_money текущего/будущих — ';
  html += 'совпадает с колонкой «Бюджет» виджета Бюджет.<br>';
  html += '² <em>Админ</em> = расходы проектов 24 (ВСИП Админ) и 26 (ТТ Общие); без НДС и Налога на прибыль. Разбивка: ФОТ+Налоги на ФОТ (кат. 9–11), Командировки (7), Бухгалтерия (17), Проценты к уплате (1008), Прочие — остаток.';
  html += '</div>';

  html += buildProchTable(agg.prochByPid);
  return html;
}

// ── СТАТУС ────────────────────────────────────────────────────────────────────

function setStatus(msg) {
  var el = document.getElementById('status');
  if (el) el.innerHTML = msg;
}

// ── ТАБЛИЦА ДЕНЕЖНОЙ ПОЗИЦИИ ──────────────────────────────────────────────────
//
// Показывает денежную позицию компании: от остатка на 01.01.2025 до текущего
// банковского остатка. Все строки — только факт. Суммы в рублях (fmtK делит /1000).
//
// Источники:
//   opening2025  = balance(bankAccounts) − net_txns_since_2025-01-01
//   netProfit    = aggregate() / (revF−vatRevF) − (costF−vatCostF) − adminF − taxF
//   vneprojNet   = расходы pid=35 без НДС (PLS cat=3157)
//   finNet       = нетто займы/кредиты (cat: Получение/Выплата кредита/займа)
//   vatCurQ      = НДС текущего квартала из PLS (3147−3144, pmDateMap-даты)
//   vatPrevQFore = нет платежей → расчётный; первый платёж → первый×3
//   vatPrevQAct  = сумма фактических платежей cat=3144 − возмещений cat=3147

function buildCashTable(agg, txns, plsItems, catMap, endDate, bankAccounts) {
  'use strict';

  // ── Квартальные границы ──────────────────────────────────────────────────
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  var y = +endDate.slice(0, 4), mo = +endDate.slice(5, 7);
  var cq = Math.ceil(mo / 3);
  var pq = cq > 1 ? cq - 1 : 4;
  var py = cq > 1 ? y : y - 1;
  function qStart(yr, q) { return yr + '-' + pad2((q - 1) * 3 + 1) + '-01'; }
  function qEnd(yr, q) {
    var lm = q * 3;
    var ld = (lm === 3 || lm === 12) ? 31 : 30;  // Q1/Q4=31дн, Q2/Q3=30дн
    return yr + '-' + pad2(lm) + '-' + pad2(ld);
  }
  var curQStart  = qStart(y, cq);
  var prevQStart = qStart(py, pq);
  var prevQEnd   = qEnd(py, pq);

  // ── pmDateMap: дата plan_money для корректного isPast у PLS ─────────────
  // (та же логика, что и в aggregate — нужна для vatRevF/vatCostF по квартально)
  var pmdm = {};
  _plans.forEach(function (item) {
    if (item.plan_paid_date) pmdm[item.id] = item.plan_paid_date;
  });
  function plsRefDt(p) {
    return (p.plan_money_id && pmdm[p.plan_money_id]) || p.date || '';
  }

  // ── Множество всех реальных счетов (включая депозиты, кассы) ────────────
  // Совпадает с полным списком счетов из Аспро (fin/bank_account).
  var REAL_ACC = {1:1,2:1,3:1,4:1,5:1,6:1,7:1,8:1,16:1,18:1,26:1,42:1,120:1,161:1,166:1};

  // ── 1. Остаток на 01.01.2025 ─────────────────────────────────────────────
  // = текущий остаток на счетах (из bank_account.balance) − нетто-движение с 01.01.2025
  var bankBal = 0;
  (bankAccounts || []).forEach(function (a) {
    if (REAL_ACC[+a.id]) bankBal += parseFloat(a.balance) || 0;
  });
  var netSince2025 = 0;
  txns.forEach(function (tx) {
    var dt = tx.date || '';
    if (!dt || dt < '2025-01-01' || dt > endDate) return;
    if (REAL_ACC[+tx.org_account_id]) {
      netSince2025 += (parseFloat(tx.income) || 0) - (parseFloat(tx.outcome) || 0);
    }
  });
  var opening2025 = bankBal - netSince2025;

  // ── 2. Чистая прибыль за период (факт, без НДС) ──────────────────────────
  // = (выручка − НДС выручки) − (себестоимость − НДС себестоимости) − Админ − Налоги
  var netProfit = (agg.revF[0] - agg.vatRevF[0])
               - (agg.costF[0] - agg.vatCostF[0])
               - agg.adminF - agg.taxF;

  // ── 3. Внепроектные расходы (project_id=35) ──────────────────────────────
  // vneprojGross = с НДС (фактические выплаты из транзакций)
  // vneprojVAT   = НДС входящий (PLS cat=3157 по этому проекту)
  // vneprojNet   = без НДС (используется в формуле остатка)
  var vneprojGross = 0, vneprojVAT = 0;
  txns.forEach(function (tx) {
    if (+tx.project_id !== 35) return;
    var dt = tx.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    if (!VSIP_ACC_IDS[tx.org_account_id] && !TT_ACC_IDS[tx.org_account_id]) return;
    if (VAT_CAT_IDS[tx.category_id]) return;
    var cn = catMap[tx.category_id] || '';
    if (SKIP_CAT_NAMES[cn]) return;
    vneprojGross += parseFloat(tx.outcome) || 0;
  });
  plsItems.forEach(function (p) {
    if (+p.project_id !== 35) return;
    var dt = p.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    if (+p.category_id === 3157) {
      // НДС входящий: outcome − income (обычно outcome > 0)
      vneprojVAT += (parseFloat(p.outcome) || 0) - (parseFloat(p.income) || 0);
    }
  });
  var vneprojNet = vneprojGross - vneprojVAT;  // без НДС

  // ── 4. Финансовая деятельность (нетто займов и кредитов) ─────────────────
  // Поступления займов/кредитов: +; Погашения: −
  // (Депозиты включены в REAL_ACC → уже в bankBal, здесь отдельно не учитываются)
  var finNet = 0;
  txns.forEach(function (tx) {
    var dt = tx.date || '';
    if (!dt || dt < START_DATE || dt > endDate) return;
    if (!REAL_ACC[+tx.org_account_id]) return;
    var cn = catMap[tx.category_id] || '';
    if (cn === 'Получение кредита' || cn === 'Получение займа') {
      finNet += parseFloat(tx.income) || 0;
    } else if (cn === 'Выплата кредита' || cn === 'Выплата займа') {
      finNet -= parseFloat(tx.outcome) || 0;
    }
  });

  // ── 5. НДС текущего квартала (прогноз) ───────────────────────────────────
  // = НДС начисленный (cat=3147) − НДС к вычету (cat=3144) за текущий квартал
  // Дата PLS корректируется через pmDateMap.
  var vRevCQ = 0, vCostCQ = 0;
  plsItems.forEach(function (p) {
    var dt = plsRefDt(p);
    if (!dt || dt < curQStart || dt > endDate) return;
    if (EXCL_PIDS[+p.project_id]) return;
    var acc = p.org_account_id;
    if (acc && !VSIP_ACC_IDS[+acc] && !TT_ACC_IDS[+acc]) return;
    var cid = +p.category_id;
    if (cid === 3147) vRevCQ  += (parseFloat(p.income)  || 0) - (parseFloat(p.outcome) || 0);
    if (cid === 3144) vCostCQ += (parseFloat(p.outcome) || 0) - (parseFloat(p.income)  || 0);
  });
  var vatCurQ = vRevCQ - vCostCQ;  // >0 = к уплате; <0 = возмещение

  // ── 6. НДС прошлого квартала ─────────────────────────────────────────────
  // Расчётный НДС за прошлый квартал (по PLS, как в виджете НДС)
  var vRevPQ = 0, vCostPQ = 0;
  plsItems.forEach(function (p) {
    var dt = plsRefDt(p);
    if (!dt || dt < prevQStart || dt > prevQEnd) return;
    if (EXCL_PIDS[+p.project_id]) return;
    var acc = p.org_account_id;
    if (acc && !VSIP_ACC_IDS[+acc] && !TT_ACC_IDS[+acc]) return;
    var cid = +p.category_id;
    if (cid === 3147) vRevPQ  += (parseFloat(p.income)  || 0) - (parseFloat(p.outcome) || 0);
    if (cid === 3144) vCostPQ += (parseFloat(p.outcome) || 0) - (parseFloat(p.income)  || 0);
  });
  var vatPrevQCalc = vRevPQ - vCostPQ;

  // Фактические платежи НДС в бюджет в текущем квартале (cat=3144, outcome)
  var vatPaidTxns = txns.filter(function (tx) {
    if (!tx.date || tx.date < curQStart || tx.date > endDate) return false;
    if (!VSIP_ACC_IDS[+tx.org_account_id] && !TT_ACC_IDS[+tx.org_account_id]) return false;
    return +tx.category_id === 3144 && (parseFloat(tx.outcome) || 0) > 0;
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });

  // Возмещения НДС из бюджета в текущем квартале (cat=3147, income в транзакциях)
  var vatRefund = 0;
  txns.forEach(function (tx) {
    if (!tx.date || tx.date < curQStart || tx.date > endDate) return;
    if (!VSIP_ACC_IDS[+tx.org_account_id] && !TT_ACC_IDS[+tx.org_account_id]) return;
    if (+tx.category_id === 3147) vatRefund += parseFloat(tx.income) || 0;
  });

  // Col 4 (прогноз): нет первого платежа → расчётный НДС прошлого квартала;
  //                  есть первый платёж → первый платёж × 3
  var vatPrevQForecast = vatPaidTxns.length > 0
    ? (parseFloat(vatPaidTxns[0].outcome) || 0) * 3
    : vatPrevQCalc;

  // Col 5 (факт уплаты): сумма всех платежей − возмещения
  var vatPaidTotal = vatPaidTxns.reduce(function (s, t) {
    return s + (parseFloat(t.outcome) || 0);
  }, 0);
  var vatPrevQActual = vatPaidTotal - vatRefund;

  // ── Итоговые строки ───────────────────────────────────────────────────────
  // Формула: Остаток = Остаток_01.01 + ЧП − Внепроектные_безНДС
  //                  + Фин_нетто − НДС_тек − НДС_прош_прогноз
  var calcBal = opening2025 + netProfit - vneprojNet + finNet - vatCurQ - vatPrevQForecast;
  var diff    = bankBal - calcBal;   // >0 = необъяснённый приход; <0 = необъяснённый расход

  // ── HTML ──────────────────────────────────────────────────────────────────
  var TD  = 'padding:5px 10px;font-size:11px;border-bottom:1px solid #e5e7eb;';
  var TH  = 'padding:5px 8px;font-size:10px;font-weight:600;border-bottom:2px solid #3d5c7a;' +
            'background:#f0f4f9;color:#374151;';
  var RIGHT = 'text-align:right;';
  var BOLD  = 'font-weight:600;';
  var BG_T  = 'background:#ecfdf5;';  // зелёный фон итоговых строк
  var BG_D  = 'background:#fef3c7;';  // жёлтый фон строки разницы

  function vBg(i) { return i % 2 === 0 ? 'background:#ffffff;' : 'background:#f9fafb;'; }

  // row(i, label, mainVal, noteText, opts)
  // mainVal — в рублях (fmtOst делит /1000); noteText — готовая строка или null
  function row(i, label, v1, noteHtml, opts) {
    opts = opts || {};
    var b  = opts.bg   || vBg(i);
    var ex = opts.bold ? BOLD : '';
    var tdL = TD + b + ex;
    var tdR = TD + RIGHT + b + ex;
    var tdN = TD + RIGHT + b + 'color:#6b7280;font-size:10px;';
    return '<tr>' +
      '<td style="' + tdL + '">' + label + '</td>' +
      '<td style="' + tdR + '">' + (v1 !== null && v1 !== undefined ? fmtOst(v1, !!opts.bold) : '&ndash;') + '</td>' +
      '<td style="' + tdN + '">' + (noteHtml || '') + '</td>' +
      '</tr>';
  }

  var h = '<div style="margin-top:20px;overflow-x:auto">';
  h += '<div style="font-size:12px;font-weight:700;color:#1e3a5f;' +
       'margin-bottom:6px;padding:0 2px;letter-spacing:0.3px">ДЕНЕЖНАЯ ПОЗИЦИЯ</div>';
  h += '<table style="border-collapse:collapse;font-size:11px;min-width:380px">';
  h += '<thead><tr>';
  h += '<th style="' + TH + 'text-align:left;min-width:240px">Показатель</th>';
  h += '<th style="' + TH + RIGHT + 'min-width:110px">Значение, тыс.</th>';
  h += '<th style="' + TH + RIGHT + 'min-width:110px">Доп.</th>';
  h += '</tr></thead><tbody>';

  var ri = 0;

  // предупреждение: если банковские счета не загрузились
  if (!bankAccounts || bankAccounts.length === 0) {
    h += '<tr><td colspan="3" style="padding:6px 10px;font-size:10px;color:#d97706;background:#fffbeb">' +
         '&#9888; fin/bank_account не загружен. Добавьте «bank_account» в ALLOWED в api/data.js.' +
         '</td></tr>';
  }

  h += row(ri++, 'Остаток на 01.01.2025',                   opening2025, null);
  h += row(ri++, 'Чистая прибыль за период (факт)',          netProfit,   null);
  h += row(ri++, 'Внепроектные расходы',
    -vneprojNet,
    vneprojGross > 0 ? 'с НДС: ' + fmtK(-vneprojGross) : null);
  h += row(ri++, 'Финансовая деятельность (нетто)',           finNet,     null);
  h += row(ri++, 'НДС текущего квартала (прогноз)',          -vatCurQ,    null);
  h += row(ri++, 'НДС прошлого квартала (прогноз)',
    -vatPrevQForecast,
    vatPrevQActual !== 0
      ? 'уплачено: ' + fmtK(-vatPrevQActual)
      : vatPaidTxns.length === 0 ? 'расчётный' : null);

  // Разделитель
  h += '<tr><td colspan="3" style="height:3px;background:#6ee7b7"></td></tr>';

  h += row(ri++, 'Остаток на текущую дату (расчётный)',  calcBal, null, { bold: true, bg: BG_T });
  h += row(ri++, 'Остаток по текущую дату (банк)',        bankBal, null, { bold: true, bg: BG_T });

  // Разница: цвет зависит от величины
  var diffNote = Math.abs(diff) > 1000000
    ? '<span style="color:#d97706">&#9888; расхождение &gt;1 млн</span>'
    : null;
  h += row(ri++, 'Разница (банк − расчётный)',            diff,    diffNote, { bold: true, bg: BG_D });

  h += '</tbody></table></div>';
  return h;
}

// ── КЭШ ДАННЫХ ───────────────────────────────────────────────────────────────

var _cats = null, _plans = null, _txns = null, _pls = null, _bankAccounts = null;

function getEndDate() {
  var el = document.getElementById('end-date');
  if (el && el.value) return el.value;
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function render() {
  if (!_cats || !_plans || !_txns || !_pls || _bankAccounts === null) return;
  var endDate = getEndDate();
  setStatus('&#9679; расчёт...');
  try {
    var agg  = aggregate(_plans, _txns, _pls, _cats, endDate);
    var html = buildTable(agg);
    html += buildCashTable(agg, _txns, _pls, _cats, endDate, _bankAccounts);
    document.getElementById('content').innerHTML = html;
    var dt = endDate.split('-').reverse().join('.');
    setStatus('&#9679; данные на ' + dt);
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div style="color:#dc2626;padding:20px">Ошибка расчёта: ' + e.message + '</div>';
    setStatus('&#9679; ошибка');
    console.error(e);
  }
}

function loadData() {
  document.getElementById('content').innerHTML =
    '<div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>';
  setStatus('&#9679; загрузка категорий...');

  // Параллельная загрузка категорий и плана
  Promise.all([
    fetchAll('categories').then(function (items) {
      var map = {};
      items.forEach(function (c) { map[c.id] = c.name || ''; });
      _cats = map;
    }),
    fetchAll('plan_money').then(function (items) {
      _plans = items;
    })
  ])
  .then(function () {
    setStatus('&#9679; загрузка транзакций...');
    return fetchAll('transaction');
  })
  .then(function (items) {
    _txns = items;
    setStatus('&#9679; загрузка НДС (PLS)...');
    return fetchAll('transaction_pls').catch(function () { return []; });
  })
  .then(function (pls) {
    _pls = pls || [];
    setStatus('&#9679; загрузка счетов...');
    return fetchAll('bank_account').catch(function () { return []; });
  })
  .then(function (accts) {
    _bankAccounts = accts || [];
    render();
  })
  .catch(function (e) {
    document.getElementById('content').innerHTML =
      '<div style="color:#dc2626;padding:20px">Ошибка загрузки: ' + e.message + '</div>';
    setStatus('&#9679; ошибка загрузки');
    console.error(e);
  });
}

// ── ИНИЦИАЛИЗАЦИЯ ─────────────────────────────────────────────────────────────

(function init() {
  // Устанавливаем дату по умолчанию = сегодня
  var d = new Date();
  var today = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');

  var selDate = document.getElementById('end-date');
  if (selDate) {
    selDate.value = today;
    selDate.addEventListener('change', function () { render(); });
  }

  document.getElementById('refresh-btn').addEventListener('click', function () {
    _cats = _plans = _txns = _pls = _bankAccounts = null;
    loadData();
  });

  loadData();
}());

})();
</script>
